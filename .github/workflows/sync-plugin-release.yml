name: Sync AP Cabinet Pro release version

on:
  workflow_dispatch:
  release:
    types: [published, edited]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ap-cabinet-pro-version-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Aphiphoom/APcncDIY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync latest uploaded RBZ asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_plugin_release.py
      - name: Commit metadata if changed
        run: |
          if git diff --quiet -- version.json; then
            echo 'version.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m 'Sync AP Cabinet Pro release metadata'
          git push
