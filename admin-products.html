<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการสินค้า · AP CNC DIY</title><style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--red:#ff7373;--green:#45c98a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}.shell{width:min(1280px,calc(100% - 28px));margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top h1{margin:0;font-size:26px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font-weight:600;cursor:pointer}.btn.primary{background:var(--amber);border-color:var(--amber);color:#171006}.btn.cyan{border-color:var(--cyan);color:var(--cyan)}.btn.danger{border-color:#6b3535;color:#ffb0b0}.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.card h2{font-size:18px;margin:0 0 12px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:12px;color:#cad5dd}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#101923;color:var(--ink);border-radius:8px;padding:9px 11px;outline:0}.field input,.field select{height:42px}.field textarea{min-height:105px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:8px;margin-top:12px}.list-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px;border:1px solid #2d3d4b;border-radius:9px;background:#111922}.list-item small{color:var(--muted)}.product-table{width:100%;border-collapse:collapse;font-size:13px}.product-table th,.product-table td{padding:10px 8px;border-bottom:1px solid #2a3946;text-align:left;vertical-align:middle}.thumb{width:58px;height:44px;border-radius:6px;object-fit:contain;background:#0a1118;border:1px solid var(--line)}.status{display:none;margin:0 0 12px;padding:10px 12px;border-radius:8px}.status.show{display:block}.status.ok{background:#10271d;border:1px solid #2e6b4c;color:#9ee2bc}.status.err{background:#2a1515;border:1px solid #6c3434;color:#ffc1c1}.muted{color:var(--muted)}.gate{text-align:center;padding:70px 20px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.product-table{font-size:12px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="shell"><div class="top"><div><h1>จัดการสินค้า</h1><div class="muted">เฉพาะ Admin</div></div><div class="actions"><a class="btn" href="admin.html">← กลับหน้า Admin</a><a class="btn cyan" href="products.html">ดูหน้าสินค้า</a></div></div><div id="status" class="status"></div><div id="gate" class="gate">กำลังตรวจสอบสิทธิ์...</div><main id="app" hidden><div class="grid"><div><section class="card"><h2>หมวดสินค้า / หมวดย่อย</h2><input id="catId" type="hidden"><div class="field"><label>ชื่อหมวด</label><input id="catName" placeholder="เช่น สวิตช์ หรือ สายไฟ"></div><div class="field"><label>หมวดแม่</label><select id="catParent"><option value="">— หมวดหลัก —</option></select></div><div class="row"><div class="field"><label>ลำดับ</label><input id="catSort" type="number" value="0"></div><div class="field"><label>สถานะ</label><select id="catActive"><option value="true">แสดง</option><option value="false">ซ่อน</option></select></div></div><div class="actions"><button id="saveCat" class="btn primary">บันทึกหมวด</button><button id="resetCat" class="btn">ล้างฟอร์ม</button></div><div id="catList" class="list"></div></section></div><div><section class="card"><h2 id="productFormTitle">เพิ่มสินค้า</h2><input id="productId" type="hidden"><div class="row"><div class="field"><label>ชื่อสินค้า</label><input id="pName"></div><div class="field"><label>หมวดสินค้า</label><select id="pCategory"><option value="">— ไม่ระบุ —</option></select></div></div><div class="field"><label>รายละเอียดแบบย่อ</label><input id="pShort" maxlength="220"></div><div class="field"><label>รายละเอียดเต็ม</label><textarea id="pDescription"></textarea></div><div class="row"><div class="field"><label>ราคา (บาท)</label><input id="pPrice" type="number" min="0" step="0.01"></div><div class="field"><label>หมายเหตุราคา</label><input id="pPriceNote" placeholder="เช่น /เมตร หรือ ราคายังไม่รวม VAT"></div></div><div class="row"><div class="field"><label>ลำดับ</label><input id="pSort" type="number" value="0"></div><div class="field"><label>สถานะ</label><select id="pPublished"><option value="false">แบบร่าง</option><option value="true">เผยแพร่</option></select></div></div><div class="field"><label>รูปหน้าปก</label><input id="pCover" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>รูปเพิ่มเติม (เลือกได้หลายรูป)</label><input id="pImages" type="file" accept="image/jpeg,image/png,image/webp" multiple></div><div class="field"><label>สเปกสินค้า</label><textarea id="pSpecs" placeholder="พิมพ์ 1 บรรทัดต่อ 1 รายการ เช่น&#10;ยี่ห้อ: Canare&#10;ขนาดสาย: 2 x 16AWG&#10;ความยาว: 100 เมตร"></textarea></div><div class="actions"><button id="saveProduct" class="btn primary">บันทึกสินค้า</button><button id="resetProduct" class="btn">ล้างฟอร์ม</button></div></section><section class="card" style="margin-top:16px"><h2>รายการสินค้า</h2><div style="overflow:auto"><table class="product-table"><thead><tr><th>รูป</th><th>สินค้า</th><th>หมวด</th><th>ราคา</th><th>สถานะ</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div></section></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="auth-client.js"></script><script>(()=>{const $=id=>document.getElementById(id),sb=window.AuthClient?.sb||window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let cats=[],products=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=v=>String(v||'item').trim().toLowerCase().replace(/[^a-z0-9ก-๙]+/g,'-').replace(/^-|-$/g,'')||('item-'+Date.now());const status=(msg,type='ok')=>{const el=$('status');el.textContent=msg;el.className='status show '+type;setTimeout(()=>el.className='status',3500)};const publicUrl=p=>p?`${window.SUPABASE_URL}/storage/v1/object/public/site-products/${String(p).split('/').map(encodeURIComponent).join('/')}`:'';const catName=id=>cats.find(c=>c.id===id)?.name||'-';function parseSpecs(){const out={};$('pSpecs').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const i=line.indexOf(':');if(i>0)out[line.slice(0,i).trim()]=line.slice(i+1).trim();else out[line]=''});return out}function specsText(obj){return Object.entries(obj||{}).map(([k,v])=>`${k}: ${v}`).join('\n')}async function guard(){const {data:{user}}=await sb.auth.getUser();if(!user)throw new Error('กรุณาเข้าสู่ระบบ');const {data,error}=await sb.from('profiles').select('role').eq('id',user.id).single();if(error||data?.role!=='admin')throw new Error('ไม่มีสิทธิ์ Admin');$('gate').hidden=true;$('app').hidden=false}function renderCats(){const roots=cats.filter(c=>!c.parent_id);$('catList').innerHTML=roots.map(r=>`<div><div class="list-item"><div><strong>${esc(r.name)}</strong><br><small>หมวดหลัก</small></div><div class="actions"><button class="btn" data-edit-cat="${r.id}">แก้ไข</button></div></div>${cats.filter(c=>c.parent_id===r.id).map(c=>`<div class="list-item" style="margin-left:18px"><div>↳ ${esc(c.name)} <small>${c.is_active?'':'(ซ่อน)'}</small></div><button class="btn" data-edit-cat="${c.id}">แก้ไข</button></div>`).join('')}</div>`).join('')||'<div class="muted">ยังไม่มีหมวดสินค้า</div>';const options=roots.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('catParent').innerHTML='<option value="">— หมวดหลัก —</option>'+options;$('pCategory').innerHTML='<option value="">— ไม่ระบุ —</option>'+cats.map(c=>`<option value="${c.id}">${c.parent_id?'↳ ':''}${esc(c.name)}</option>`).join('');document.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>editCat(b.dataset.editCat))}function renderProducts(){$('productRows').innerHTML=products.map(p=>`<tr><td>${p.cover_path?`<img class="thumb" src="${esc(publicUrl(p.cover_path))}">`:'-'}</td><td><strong>${esc(p.name)}</strong><br><small class="muted">${esc(p.short_description||'')}</small></td><td>${esc(catName(p.category_id))}</td><td>${p.price==null?'-':Number(p.price).toLocaleString('th-TH')}</td><td>${p.is_published?'เผยแพร่':'แบบร่าง'}</td><td><div class="actions"><button class="btn" data-edit-product="${p.id}">แก้ไข</button><button class="btn danger" data-del-product="${p.id}">ลบ</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="muted">ยังไม่มีสินค้า</td></tr>';document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editProduct(b.dataset.editProduct));document.querySelectorAll('[data-del-product]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delProduct))}async function reload(){const [c,p]=await Promise.all([sb.from('product_categories').select('*').order('sort_order').order('name'),sb.from('site_products').select('*').order('sort_order').order('created_at',{ascending:false})]);if(c.error)throw c.error;if(p.error)throw p.error;cats=c.data||[];products=p.data||[];renderCats();renderProducts()}function resetCat(){$('catId').value='';$('catName').value='';$('catParent').value='';$('catSort').value=0;$('catActive').value='true'}function editCat(id){const c=cats.find(x=>x.id===id);if(!c)return;$('catId').value=c.id;$('catName').value=c.name;$('catParent').value=c.parent_id||'';$('catSort').value=c.sort_order||0;$('catActive').value=String(c.is_active);scrollTo({top:0,behavior:'smooth'})}async function saveCat(){const name=$('catName').value.trim();if(!name)return status('กรุณาใส่ชื่อหมวด','err');const id=$('catId').value,payload={name,slug:slug(name)+(id?'':'-'+Date.now()),parent_id:$('catParent').value||null,sort_order:Number($('catSort').value||0),is_active:$('catActive').value==='true',updated_at:new Date().toISOString()};let r;if(id){delete payload.slug;r=await sb.from('product_categories').update(payload).eq('id',id)}else r=await sb.from('product_categories').insert(payload);if(r.error)throw r.error;resetCat();await reload();status('บันทึกหมวดสินค้าแล้ว')}function resetProduct(){$('productId').value='';$('productFormTitle').textContent='เพิ่มสินค้า';['pName','pShort','pDescription','pPrice','pPriceNote','pSpecs'].forEach(x=>$(x).value='');$('pCategory').value='';$('pSort').value=0;$('pPublished').value='false';$('pCover').value='';$('pImages').value=''}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;$('productId').value=p.id;$('productFormTitle').textContent='แก้ไขสินค้า';$('pName').value=p.name||'';$('pCategory').value=p.category_id||'';$('pShort').value=p.short_description||'';$('pDescription').value=p.description||'';$('pPrice').value=p.price??'';$('pPriceNote').value=p.price_note||'';$('pSort').value=p.sort_order||0;$('pPublished').value=String(p.is_published);$('pSpecs').value=specsText(p.specs);scrollTo({top:0,behavior:'smooth'})}async function upload(file,prefix){if(!file)return null;if(file.size>15*1024*1024)throw new Error('ไฟล์รูปต้องไม่เกิน 15 MB');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const r=await sb.storage.from('site-products').upload(path,file,{upsert:false});if(r.error)throw r.error;return path}async function saveProduct(){const name=$('pName').value.trim();if(!name)return status('กรุณาใส่ชื่อสินค้า','err');const id=$('productId').value,existing=products.find(x=>x.id===id);$('saveProduct').disabled=true;try{let cover=existing?.cover_path||null;if($('pCover').files[0])cover=await upload($('pCover').files[0],'covers');let images=Array.isArray(existing?.image_paths)?[...existing.image_paths]:[];for(const f of $('pImages').files)images.push(await upload(f,'gallery'));const payload={category_id:$('pCategory').value||null,name,short_description:$('pShort').value.trim()||null,description:$('pDescription').value.trim()||null,price:$('pPrice').value===''?null:Number($('pPrice').value),price_note:$('pPriceNote').value.trim()||null,cover_path:cover,image_paths:images,specs:parseSpecs(),is_published:$('pPublished').value==='true',sort_order:Number($('pSort').value||0),updated_at:new Date().toISOString()};let r;if(id)r=await sb.from('site_products').update(payload).eq('id',id);else r=await sb.from('site_products').insert({...payload,slug:slug(name)+'-'+Date.now()});if(r.error)throw r.error;resetProduct();await reload();status('บันทึกสินค้าแล้ว')}finally{$('saveProduct').disabled=false}}async function deleteProduct(id){if(!confirm('ลบสินค้านี้หรือไม่?'))return;const r=await sb.from('site_products').delete().eq('id',id);if(r.error)throw r.error;await reload();status('ลบสินค้าแล้ว')}$('saveCat').onclick=()=>saveCat().catch(e=>status(e.message,'err'));$('resetCat').onclick=resetCat;$('saveProduct').onclick=()=>saveProduct().catch(e=>status(e.message,'err'));$('resetProduct').onclick=resetProduct;guard().then(reload).catch(e=>{$('gate').textContent=e.message})})();</script></body></html>
