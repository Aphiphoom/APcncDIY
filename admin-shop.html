<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--green:#45c98a;--red:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}.shell{width:min(1350px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer}.btn.primary{background:var(--amber);border-color:var(--amber);color:#171006;font-weight:700}.btn.cyan{border-color:var(--cyan);color:var(--cyan)}.btn.red{border-color:#6d3636;color:#ffb0b0}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}.card h2{margin:0 0 12px;font-size:19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field span{font-size:12px;color:#cbd5dd}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#101923;color:var(--ink);border-radius:8px;padding:9px 10px}.field textarea{min-height:70px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}.table th,.table td{text-align:left;padding:9px 8px;border-bottom:1px solid #2a3946;vertical-align:middle}.muted{color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--amber)}.danger{color:var(--red)}.stockrow{display:grid;grid-template-columns:minmax(220px,1fr) 120px 120px auto;gap:9px;align-items:end;padding:9px 0;border-bottom:1px solid #2a3946}.stockrow input{height:38px;border:1px solid var(--line);border-radius:7px;background:#101923;color:var(--ink);padding:0 8px}.pill{font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:999px}.detail{display:none}.detail.show{display:block}.slip{max-width:100%;max-height:70vh;object-fit:contain;background:#091018;border:1px solid var(--line);border-radius:8px}.statusmsg{display:none;padding:10px 12px;margin-bottom:12px;border-radius:8px}.statusmsg.show{display:block;background:#10271d;border:1px solid #2e6b4c;color:#a9e7c3}.statusmsg.err{background:#2a1515;border-color:#6c3434;color:#ffc1c1}.trackingbox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:9px;background:#101923}.trackingbox h3{margin:0 0 10px;font-size:15px}.trackinggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trackinggrid input{width:100%;height:40px;border:1px solid var(--line);border-radius:7px;background:#0d151d;color:var(--ink);padding:0 10px}.trackingbox .btn{margin-top:10px}.gate{text-align:center;padding:60px;color:var(--muted)}@media(max-width:820px){.grid2,.fields,.trackinggrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.stockrow{grid-template-columns:1fr 1fr}.stockrow>div:first-child{grid-column:1/-1}.stockrow .btn{width:100%}}@media(max-width:600px){.shell{width:calc(100% - 20px);padding-top:14px}.card{padding:12px;border-radius:12px}.detail{min-width:0}.detail .top{gap:8px;align-items:flex-start}.detail .top h2{font-size:17px;line-height:1.45;overflow-wrap:anywhere;min-width:0;flex:1}.detail .top .btn{flex-shrink:0}.detail .grid2,.detail .grid2>div{min-width:0}.detail .customer-info{margin:8px 0 14px;font-size:15px;line-height:1.7;overflow-wrap:anywhere;word-break:break-word}.detail .customer-info strong{font-size:17px}.detail .tablewrap{overflow:visible;max-width:100%}.detail .table{min-width:0;width:100%;table-layout:fixed}.detail .table thead{display:none}.detail .table tbody{display:grid;gap:8px}.detail .table tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#101923;min-width:0}.detail .table td{display:block;padding:0;border:0;min-width:0;overflow-wrap:anywhere;font-size:13px}.detail .table td:first-child{grid-column:1/-1;font-size:15px;font-weight:500}.detail .table td:nth-child(2)::before{content:"จำนวน: ";color:var(--muted)}.detail .table td:nth-child(3)::before{content:"ราคาต่อหน่วย: ";color:var(--muted)}.detail .table td:nth-child(4)::before{content:"รวม: ";color:var(--muted)}.detail .table td:nth-child(4){grid-column:1/-1;text-align:right;font-weight:600}.detail .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail .actions .btn{min-width:0;width:100%;padding:9px 6px;min-height:44px;white-space:normal;text-align:center}.detail .actions .btn.primary{grid-column:1/-1;grid-row:1}.detail .trackingbox{padding:11px}.detail .trackinggrid{grid-template-columns:minmax(0,1fr)}.detail .trackinggrid input{min-width:0}.detail .slip{width:auto;max-width:100%;height:auto}}.order-detail-layout{display:grid;gap:16px;min-width:0}.order-section{min-width:0}.order-section-title{font-size:14px;font-weight:600;margin:0 0 9px;color:var(--muted)}.order-customer{display:grid;gap:3px;overflow-wrap:anywhere}.order-customer strong{font-size:18px}.order-customer .muted{overflow-wrap:anywhere}.order-item-list{display:grid;gap:9px}.order-item{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#101923;min-width:0}.order-item-name{font-size:16px;font-weight:600;overflow-wrap:anywhere}.order-item-variant{color:var(--muted);font-size:14px;overflow-wrap:anywhere}.order-item-meta{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:10px;font-size:14px}.order-item-meta span:nth-child(odd){color:var(--muted)}.order-item-meta span:nth-child(even){text-align:right}.order-total{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:19px;font-weight:600}.order-total strong{white-space:nowrap}.order-action-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.order-action-row .btn{width:100%;min-width:0;min-height:46px;padding:9px 8px;white-space:normal;text-align:center}.order-action-row .btn.primary{grid-column:1/-1;grid-row:1}.order-extra{overflow-wrap:anywhere;white-space:pre-wrap}.order-detail-layout .trackingbox{margin-top:0}@media(min-width:821px){.order-detail-layout{grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);column-gap:22px}.order-detail-layout .order-main{grid-column:1}.order-detail-layout .order-side{grid-column:2;grid-row:1 / span 3;align-self:start}.order-detail-layout .order-total{grid-column:1}.order-detail-layout .order-actions{grid-column:1}}@media(max-width:600px){.order-detail-layout{gap:14px}.order-item{padding:12px}.order-item-meta{font-size:13px}.order-total{font-size:18px}.order-action-row{gap:8px}}</style></head>
<body><div class="shell"><div class="top"><div><h1 style="margin:0">ร้านค้าและคำสั่งซื้อ</h1><div class="muted">สต็อก · ชำระเงิน · ตรวจสลิป</div></div><div class="actions"><a class="btn" href="admin.html">← Admin</a><button id="tabOrders" class="btn">คำสั่งซื้อ</button></div></div><div id="msg" class="statusmsg"></div><div id="gate" class="gate">กำลังตรวจสอบสิทธิ์...</div><main id="app" hidden>
<section id="inventorySection" class="card"><h2>สต็อกสินค้า</h2><div class="muted" style="font-size:12px;margin-bottom:10px">สินค้าและตัวเลือกแต่ละรายการแสดงเป็นหนึ่งแถว</div><div class="tablewrap"><table class="table"><thead><tr><th>สินค้า</th><th>ตัวเลือก</th><th>จำกัดสต็อก</th><th>จองแล้ว</th><th>จำนวนจริง</th><th></th></tr></thead><tbody id="inventory"></tbody></table></div></section>
<section id="ordersSection" class="card" hidden><h2>รายการคำสั่งซื้อ</h2><div class="actions" style="margin-bottom:10px"><select id="statusFilter" class="btn"><option value="">ทุกสถานะ</option><option value="payment_submitted">รอตรวจสลิป</option><option value="awaiting_payment">รอชำระ</option><option value="paid">ชำระแล้ว</option><option value="preparing">กำลังเตรียม</option><option value="shipped">จัดส่งแล้ว</option><option value="completed">สำเร็จ</option><option value="rejected">สลิปไม่ผ่าน</option><option value="cancelled">ยกเลิก</option><option value="expired">หมดเวลา</option></select><button id="refreshOrders" class="btn">รีเฟรช</button></div><div class="tablewrap"><table class="table"><thead><tr><th>เลขออเดอร์</th><th>ลูกค้า</th><th>ยอด</th><th>สถานะ</th><th>เวลา</th><th></th></tr></thead><tbody id="orderRows"></tbody></table></div></section>
<section id="detail" class="card detail"><div class="top"><h2 id="detailTitle">รายละเอียดคำสั่งซื้อ</h2><button id="closeDetail" class="btn">ปิด</button></div><div id="detailBody"></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="auth-client.js"></script><script src="product-storage.js"></script>
<script>(()=>{const $=id=>document.getElementById(id),sb=window.AuthClient?.sb||window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let products=[],variants=[],orders=[];const fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=v=>v?new Date(v).toLocaleString('th-TH'):'-',statusText=s=>({awaiting_payment:'รอชำระ',payment_submitted:'รอตรวจสลิป',paid:'ชำระแล้ว',rejected:'สลิปไม่ผ่าน',cancelled:'ยกเลิก',expired:'หมดเวลา',preparing:'กำลังเตรียม',shipped:'จัดส่งแล้ว',completed:'สำเร็จ'}[s]||s),notify=(m,err=false)=>{const e=$('msg');e.textContent=m;e.className='statusmsg show'+(err?' err':'');setTimeout(()=>e.className='statusmsg',3500)};async function guard(){const {data:{user}}=await sb.auth.getUser();if(!user)throw new Error('กรุณาเข้าสู่ระบบ');const {data,error}=await sb.from('profiles').select('role').eq('id',user.id).single();if(error||data?.role!=='admin')throw new Error('ไม่มีสิทธิ์ Admin');$('gate').hidden=true;$('app').hidden=false}async function loadSettings(){const {data,error}=await sb.from('shop_settings').select('*').eq('singleton',true).single();if(error)throw error;$('bankName').value=data.bank_name||'';$('accountName').value=data.account_name||'';$('accountNumber').value=data.account_number||'';$('promptpay').value=data.promptpay_id||'';$('paymentNote').value=data.payment_note||'';$('shippingFee').value=data.shipping_fee??0;$('reserveMinutes').value=data.reservation_minutes??60}async function saveSettings(){const {data:{user}}=await sb.auth.getUser();const payload={bank_name:$('bankName').value.trim(),account_name:$('accountName').value.trim(),account_number:$('accountNumber').value.trim(),promptpay_id:$('promptpay').value.trim(),payment_note:$('paymentNote').value.trim(),shipping_fee:Number($('shippingFee').value||0),reservation_minutes:Number($('reserveMinutes').value||60),updated_at:new Date().toISOString(),updated_by:user.id};const {error}=await sb.from('shop_settings').update(payload).eq('singleton',true);if(error)throw error;notify('บันทึกข้อมูลรับชำระแล้วครับ')}async function loadInventory(){const [p,v]=await Promise.all([sb.from('site_products').select('id,name,track_inventory,stock_qty,stock_reserved,is_published').order('sort_order').order('created_at'),sb.from('site_product_variants').select('id,product_id,name,stock_qty,stock_reserved,is_active').order('sort_order').order('created_at')]);if(p.error)throw p.error;if(v.error)throw v.error;products=p.data||[];variants=v.data||[];renderInventory()}function renderInventory(){const rows=[];products.forEach(p=>{const vs=variants.filter(v=>v.product_id===p.id);if(vs.length){vs.forEach((v,idx)=>rows.push(`<tr><td><strong>${idx===0?esc(p.name):''}</strong></td><td>${esc(v.name)}</td><td>${idx===0?`<label><input type="checkbox" data-track="${p.id}" ${p.track_inventory?'checked':''}> ใช้งาน</label>`:''}</td><td>${Number(v.stock_reserved||0).toLocaleString('th-TH')}</td><td><input data-vstock="${v.id}" type="number" min="0" value="${v.stock_qty||0}" style="width:90px;height:36px;border:1px solid var(--line);border-radius:7px;background:#101923;color:var(--ink);padding:0 8px"></td><td><button class="btn" data-save-v="${v.id}">บันทึก</button></td></tr>`))}else rows.push(`<tr><td><strong>${esc(p.name)}</strong></td><td class="muted">—</td><td><label><input type="checkbox" data-track="${p.id}" ${p.track_inventory?'checked':''}> ใช้งาน</label></td><td>${Number(p.stock_reserved||0).toLocaleString('th-TH')}</td><td><input data-pstock="${p.id}" type="number" min="0" value="${p.stock_qty||0}" style="width:90px;height:36px;border:1px solid var(--line);border-radius:7px;background:#101923;color:var(--ink);padding:0 8px"></td><td><button class="btn" data-save-p="${p.id}">บันทึก</button></td></tr>`)});$('inventory').innerHTML=rows.join('')||'<tr><td colspan="6" class="muted">ยังไม่มีสินค้า</td></tr>';document.querySelectorAll('[data-track]').forEach(x=>x.onchange=async()=>{const {error}=await sb.from('site_products').update({track_inventory:x.checked,updated_at:new Date().toISOString()}).eq('id',x.dataset.track);if(error)return notify(error.message,true);notify('อัปเดตการจำกัดสต็อกแล้วครับ')});document.querySelectorAll('[data-save-p]').forEach(b=>b.onclick=async()=>{const input=document.querySelector('[data-pstock="'+b.dataset.saveP+'"]'),{error}=await sb.from('site_products').update({stock_qty:Math.max(0,Number(input.value)||0),updated_at:new Date().toISOString()}).eq('id',b.dataset.saveP);if(error)return notify(error.message,true);await loadInventory();notify('บันทึกสต็อกแล้วครับ')});document.querySelectorAll('[data-save-v]').forEach(b=>b.onclick=async()=>{const input=document.querySelector('[data-vstock="'+b.dataset.saveV+'"]'),{error}=await sb.from('site_product_variants').update({stock_qty:Math.max(0,Number(input.value)||0),updated_at:new Date().toISOString()}).eq('id',b.dataset.saveV);if(error)return notify(error.message,true);await loadInventory();notify('บันทึกสต็อกตัวเลือกแล้วครับ')})}async function loadOrders(){let q=sb.from('shop_orders').select('*').order('created_at',{ascending:false}).limit(200);if($('statusFilter').value)q=q.eq('status',$('statusFilter').value);const {data,error}=await q;if(error)throw error;orders=data||[];renderOrders();const target=new URLSearchParams(location.search).get('order');if(target&&orders.some(o=>o.id===target))openOrder(target)}function renderOrders(){$('orderRows').innerHTML=orders.map(o=>`<tr><td><strong>${esc(o.order_no)}</strong></td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.phone)}</span></td><td>${fmt(o.total)}</td><td><span class="pill">${esc(statusText(o.status))}</span></td><td>${dt(o.created_at)}</td><td><button class="btn" data-order="${o.id}">เปิด</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">ยังไม่มีคำสั่งซื้อ</td></tr>';document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>openOrder(b.dataset.order))}async function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const {data:items,error}=await sb.from('shop_order_items').select('*').eq('order_id',id).order('created_at');if(error)return notify(error.message,true);$('detail').classList.add('show');$('detailTitle').textContent='คำสั่งซื้อ '+o.order_no;const canSlip=!!o.slip_path,isMembership=Number(o.membership_plan_days||0)>0||(items||[]).some(i=>i.product_name==='AP Cabinet Pro Membership');const itemCards=(items||[]).map(i=>`<article class="order-item"><div class="order-item-name">${esc(i.product_name)}</div>${i.variant_name?'<div class="order-item-variant">'+esc(i.variant_name)+'</div>':''}<div class="order-item-meta"><span>จำนวน</span><span>${esc(i.quantity)}</span><span>ราคาต่อหน่วย</span><span>${fmt(i.unit_price)}</span><span>รวมรายการ</span><span><strong>${fmt(i.line_total)}</strong></span></div></article>`).join('')||'<p class="muted">ไม่มีรายการสินค้า</p>';$('detailBody').innerHTML=`<div class="order-detail-layout"><div class="order-main"><section class="order-section"><h3 class="order-section-title">ข้อมูลลูกค้า</h3><div class="order-customer"><strong>${esc(o.customer_name)}</strong><span>${esc(o.phone)}</span>${o.email?'<span>'+esc(o.email)+'</span>':''}</div>${o.shipping_address?'<p class="order-extra muted">'+esc(o.shipping_address)+'</p>':''}${o.customer_note?'<p class="order-extra">หมายเหตุ: '+esc(o.customer_note)+'</p>':''}</section><section class="order-section"><h3 class="order-section-title">รายการสินค้า</h3><div class="order-item-list">${itemCards}</div></section></div><div class="order-total"><span>ยอดรวมทั้งสิ้น</span><strong>${fmt(o.total)}</strong></div><div class="order-actions"><div class="order-action-row"><button class="btn primary" data-status="paid">ยืนยันชำระ</button>${canSlip?'<button id="viewSlip" class="btn cyan">ดูสลิป</button>':''}<button class="btn red" data-status="cancelled">ยกเลิก</button></div></div><div class="order-side">${!isMembership&&o.status==='paid'?'<div class="trackingbox"><h3>ข้อมูลการจัดส่ง</h3><div class="trackinggrid"><div><div class="muted" style="font-size:12px;margin-bottom:5px">บริษัทที่จัดส่ง</div><input id="shippingCarrier" value="'+esc(o.shipping_carrier||'')+'" placeholder="เช่น Flash Express, Kerry, ไปรษณีย์ไทย"></div><div><div class="muted" style="font-size:12px;margin-bottom:5px">เลข Tracking</div><input id="trackingNumber" value="'+esc(o.tracking_number||'')+'" placeholder="กรอกเลขพัสดุ"></div></div><button id="saveTracking" class="btn cyan">บันทึกข้อมูลจัดส่ง</button></div>':''}<div id="slipWrap" style="margin-top:12px"></div></div></div>`;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(o.id,b.dataset.status));if(canSlip)$('viewSlip').onclick=()=>viewSlip(o.id);if(!isMembership&&o.status==='paid'&&$('saveTracking'))$('saveTracking').onclick=()=>saveTracking(o.id);$('detail').scrollIntoView({behavior:'smooth',block:'start'})}async function setStatus(id,status){if(status==='paid'&&!confirm('ยืนยันว่าได้รับเงินแล้วใช่ไหมครับ?'))return;if(status==='cancelled'&&!confirm('ยกเลิกคำสั่งซื้อนี้และคืนสต็อกที่จองไว้ใช่ไหมครับ?'))return;if(status==='paid'){const {data,error}=await sb.rpc('admin_confirm_shop_order_payment',{p_order_id:id});if(error)return notify(error.message,true);await Promise.all([loadOrders(),loadInventory()]);const days=Number(data?.membership_plan_days||0),expiry=data?.membership_expires_at;notify(days?'ยืนยันชำระและเพิ่มสิทธิ์ '+days+' วันแล้วครับ'+(expiry?' ถึง '+dt(expiry):''):'ยืนยันชำระแล้วครับ');openOrder(id);return}const {error}=await sb.from('shop_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return notify(error.message,true);await Promise.all([loadOrders(),loadInventory()]);notify('อัปเดตสถานะแล้วครับ');openOrder(id)}async function saveTracking(id){const carrier=$('shippingCarrier')?.value.trim()||'',tracking=$('trackingNumber')?.value.trim()||'';const {error}=await sb.rpc('admin_update_shop_order_tracking',{p_order_id:id,p_shipping_carrier:carrier,p_tracking_number:tracking});if(error)return notify(error.message,true);await loadOrders();notify('บันทึกข้อมูลจัดส่งแล้วครับ');openOrder(id)}async function viewSlip(id){const wrap=$('slipWrap');wrap.textContent='กำลังโหลดสลิป...';const {data:{session}}=await sb.auth.getSession();const res=await fetch('/api/shop-orders/slip/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+session.access_token}});if(!res.ok){wrap.textContent='เปิดสลิปไม่สำเร็จครับ';return}const blob=await res.blob(),url=URL.createObjectURL(blob);wrap.innerHTML=blob.type==='application/pdf'?'<a class="btn cyan" target="_blank" href="'+url+'">เปิดไฟล์ PDF</a>':'<img class="slip" src="'+url+'">'}function showTab(tab){const inv=tab==='inventory';$('inventorySection').hidden=!inv;$('ordersSection').hidden=inv;$('detail').classList.remove('show');const tabInventory=$('tabInventory'),tabOrders=$('tabOrders');if(tabInventory)tabInventory.classList.toggle('primary',inv);if(tabOrders)tabOrders.classList.toggle('primary',!inv)}$('tabOrders').onclick=()=>showTab('orders');if(new URLSearchParams(location.search).get('order'))showTab('orders');$('statusFilter').onchange=()=>loadOrders().catch(e=>notify(e.message,true));$('refreshOrders').onclick=()=>loadOrders().catch(e=>notify(e.message,true));$('closeDetail').onclick=()=>$('detail').classList.remove('show');guard().then(()=>Promise.all([loadInventory(),loadOrders()])).catch(e=>$('gate').textContent=e.message)})();</script></body></html>
