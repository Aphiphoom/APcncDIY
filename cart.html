<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตะกร้าสินค้า · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--red:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}a{text-decoration:none;color:inherit}.shell{width:min(1000px,calc(100% - 28px));margin:auto;padding:26px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.btn{display:inline-flex;min-height:42px;padding:0 16px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-weight:600;cursor:pointer;color:var(--ink)}.btn.primary{background:var(--amber);border-color:var(--amber);color:#171006}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.cart-title{margin:0;font-size:clamp(24px,5vw,34px);line-height:1.25;white-space:nowrap}.item{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid #293845}.item:last-of-type{border-bottom:1px solid #293845}.item img{width:84px;height:84px;object-fit:contain;background:#0a1118;border-radius:9px}.item-info{min-width:0}.item-name{font-size:16px;font-weight:600;overflow-wrap:anywhere}.item-variant{font-size:14px;overflow-wrap:anywhere}.item-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;margin-top:12px;font-size:14px}.item-meta .meta-label{color:var(--muted)}.item-meta .meta-value{text-align:right;font-weight:500;min-width:0}.item-meta .line-total{font-weight:700;color:var(--ink)}.item-side{display:flex;align-items:flex-start;justify-content:flex-end}.muted{color:var(--muted)}input{width:72px;height:38px;border:1px solid var(--line);border-radius:7px;background:#101923;color:var(--ink);padding:0 9px;font:inherit;text-align:center}.remove{background:none;border:1px solid #6d3636;border-radius:7px;color:var(--red);cursor:pointer;font:inherit;padding:5px 12px;min-height:36px}.summary{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:18px}.total{font-size:22px;color:var(--amber);font-weight:700}.empty{text-align:center;padding:48px 18px;color:var(--muted)}@media(max-width:720px){.shell{width:calc(100% - 20px);padding-top:18px}.top{align-items:stretch;flex-direction:column;gap:12px}.top .btn{align-self:flex-end;width:auto;min-height:38px}.card{padding:14px}.item{grid-template-columns:68px minmax(0,1fr);gap:10px;padding:14px 0}.item img{width:68px;height:68px}.item-side{grid-column:2;grid-row:2;justify-content:flex-end}.item-meta{margin-top:10px;gap:8px;font-size:13px}.item-name{font-size:15px}.item-variant{font-size:13px}.summary{align-items:stretch;flex-direction:column}.summary>div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.summary .btn{width:100%}.total{font-size:20px}}</style></head>
<body><script src="config.js"></script><script src="product-storage.js"></script><script src="shop-cart.js"></script><div class="shell"><div class="top"><h1 class="cart-title">ตะกร้าสินค้า</h1><a class="btn" href="products.html">เลือกสินค้าต่อ</a></div><div id="root" class="card"></div></div>
<script>(()=>{const root=document.getElementById('root'),fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),img=p=>window.ProductImageStorage?.url(p)||'';function render(){const items=ShopCart.read();if(!items.length){root.innerHTML='<div class="empty">ยังไม่มีสินค้าในตะกร้า<br><br><a class="btn" href="products.html">ไปหน้าสินค้า</a></div>';return}let total=0;root.innerHTML=items.map((x,idx)=>{const q=Number(x.quantity)||1,p=Number(x.price)||0;total+=q*p;return `<div class="item" data-product="${esc(x.product_id)}" data-variant="${esc(x.variant_id||'')}">${x.image_path?`<img src="${esc(img(x.image_path))}" alt="${esc(x.product_name)}">`:'<div></div>'}<div class="item-info"><div class="item-name">${esc(x.product_name)}</div>${x.variant_name?`<div class="item-variant muted">${esc(x.variant_name)}</div>`:''}<div class="item-meta"><span class="meta-label">ราคาต่อหน่วย</span><span class="meta-value">${fmt(p)}</span><label class="meta-label" for="qty-${idx}">จำนวน</label><span class="meta-value"><input id="qty-${idx}" type="number" min="1" max="99" value="${q}" aria-label="จำนวน ${esc(x.product_name)}"></span><span class="meta-label">รวมรายการ</span><span class="meta-value line-total">${fmt(q*p)}</span></div></div><div class="item-side"><button class="remove" aria-label="ลบ ${esc(x.product_name)}">ลบ</button></div></div>`}).join('')+`<div class="summary"><div><span class="muted">ราคารวม</span> <span class="total">${fmt(total)}</span></div><a class="btn primary" href="checkout.html">ดำเนินการสั่งซื้อ</a></div><div class="muted" style="font-size:12px;margin-top:12px">ระบบจะตรวจราคาและสต็อกจริงอีกครั้งตอนสร้างคำสั่งซื้อครับ</div>`;root.querySelectorAll('.item').forEach(row=>{const p=row.dataset.product,v=row.dataset.variant;row.querySelector('input').onchange=e=>{ShopCart.update(p,v,Math.max(1,Math.min(99,Number(e.target.value)||1)));render()};row.querySelector('.remove').onclick=()=>{ShopCart.remove(p,v);render()}})}render()})();</script></body></html>
