<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตะกร้าสินค้า · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--red:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}a{text-decoration:none;color:inherit}.shell{width:min(1000px,calc(100% - 28px));margin:auto;padding:26px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.btn{display:inline-flex;min-height:42px;padding:0 16px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-weight:600;cursor:pointer;color:var(--ink)}.btn.primary{background:var(--amber);border-color:var(--amber);color:#171006}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.item{display:grid;grid-template-columns:90px 1fr 100px 110px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #293845}.item img{width:90px;height:72px;object-fit:contain;background:#0a1118;border-radius:8px}.muted{color:var(--muted)}input{width:80px;height:40px;border:1px solid var(--line);border-radius:7px;background:#101923;color:var(--ink);padding:0 9px;font:inherit}.remove{background:none;border:0;color:var(--red);cursor:pointer;font:inherit}.summary{display:flex;justify-content:flex-end;gap:18px;align-items:center;margin-top:18px}.total{font-size:22px;color:var(--amber);font-weight:700}.empty{text-align:center;padding:48px 18px;color:var(--muted)}@media(max-width:720px){.item{grid-template-columns:72px 1fr;gap:8px}.item img{width:72px;height:62px}.item .qty,.item .price,.item .remove{grid-column:2}.summary{align-items:stretch;flex-direction:column}.btn{width:100%}}</style></head>
<body><script src="product-storage.js"></script><script src="shop-cart.js"></script><div class="shell"><div class="top"><div><h1 style="margin:0">ตะกร้าสินค้า</h1><div class="muted">สั่งซื้อได้โดยไม่ต้องเข้าสู่ระบบครับ</div></div><a class="btn" href="products.html">เลือกสินค้าต่อ</a></div><div id="root" class="card"></div></div>
<script>(()=>{const root=document.getElementById('root'),fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),img=p=>window.ProductImageStorage?.url(p)||'';function render(){const items=ShopCart.read();if(!items.length){root.innerHTML='<div class="empty">ยังไม่มีสินค้าในตะกร้า<br><br><a class="btn" href="products.html">ไปหน้าสินค้า</a></div>';return}let total=0;root.innerHTML=items.map(x=>{const q=Number(x.quantity)||1,p=Number(x.price)||0;total+=q*p;return `<div class="item" data-product="${esc(x.product_id)}" data-variant="${esc(x.variant_id||'')}">${x.image_path?`<img src="${esc(img(x.image_path))}">`:'<div></div>'}<div><strong>${esc(x.product_name)}</strong><div class="muted">${esc(x.variant_name||'')}</div></div><div class="qty"><input type="number" min="1" max="99" value="${q}"></div><div class="price">${fmt(q*p)}</div><button class="remove">ลบ</button></div>`}).join('')+`<div class="summary"><div><span class="muted">ยอดประมาณการ</span> <span class="total">${fmt(total)}</span></div><a class="btn primary" href="checkout.html">ดำเนินการสั่งซื้อ</a></div><div class="muted" style="font-size:12px;margin-top:12px">ระบบจะตรวจราคาและสต็อกจริงอีกครั้งตอนสร้างคำสั่งซื้อครับ</div>`;root.querySelectorAll('.item').forEach(row=>{const p=row.dataset.product,v=row.dataset.variant;row.querySelector('input').onchange=e=>{ShopCart.update(p,v,Math.max(1,Math.min(99,Number(e.target.value)||1)));render()};row.querySelector('.remove').onclick=()=>{ShopCart.remove(p,v);render()}})}render()})();</script></body></html>
