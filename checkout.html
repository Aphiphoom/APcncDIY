<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สั่งซื้อสินค้า · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}.shell{width:min(1050px,calc(100% - 28px));margin:auto;padding:26px 0 50px}.layout{display:grid;grid-template-columns:1fr 360px;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.field{display:grid;gap:6px;margin-bottom:11px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#101923;color:var(--ink);border-radius:8px;padding:10px 11px;font:inherit}.field textarea{min-height:110px}.muted{color:var(--muted)}.btn{width:100%;min-height:44px;border:1px solid var(--amber);border-radius:8px;background:var(--amber);color:#171006;font:700 16px Kanit;cursor:pointer}.btn:disabled{opacity:.55}.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #293845}.error{color:var(--red);margin-top:10px}.total{font-size:22px;color:var(--amber);font-weight:700}@media(max-width:760px){.layout{grid-template-columns:1fr}}.bankbox{margin-top:14px;padding:15px;background:#0d151d;border:1px solid var(--line);border-radius:9px}.bankbox h3{margin:0 0 10px;font-size:17px}.bankrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #293845;font-size:14px}.bankrow:last-child{border-bottom:0}.bankrow>span{color:var(--muted)}.bankrow strong{overflow-wrap:anywhere;text-align:right}.copy-account{border:1px solid #52697d;border-radius:7px;background:#1e2b39;color:var(--ink);font:600 14px Kanit;cursor:pointer;padding:8px 10px;display:inline-flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;max-width:100%}.copy-account small{font-weight:400;color:var(--cyan);white-space:nowrap}.copy-feedback{font-size:12px;color:#45c98a;min-height:18px;margin-top:8px}.slipbox{margin:14px 0;padding:14px;border:1px dashed #52697d;border-radius:9px;background:#101923}.slipbox input{display:block;margin-top:8px;width:100%;color:var(--ink);font:inherit;min-width:0}.pay-note{font-size:12px;line-height:1.6;color:var(--muted)}.layout>*{min-width:0}@media(max-width:760px){.shell{width:calc(100% - 20px);padding-top:16px}.card{padding:14px}.bankrow.bank-account-row{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}.copy-account{width:100%}.copy-account small{font-size:11px}.line{min-width:0}.line>div{min-width:0;overflow-wrap:anywhere}}</style></head>
<body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="shop-cart.js"></script><div class="shell"><h1>ข้อมูลจัดส่ง</h1><div class="layout"><section class="card"><div class="field"><label>ชื่อผู้รับ *</label><input id="name" autocomplete="name"></div><div class="field"><label>เบอร์โทร *</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>อีเมล</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>ที่อยู่จัดส่ง *</label><textarea id="address" autocomplete="street-address"></textarea></div><div class="field"><label>หมายเหตุ</label><textarea id="note"></textarea></div><div class="slipbox"><strong>แนบสลิปการโอน *</strong><div class="muted" style="font-size:12px;margin-top:3px">รองรับ JPG, PNG, WebP และ PDF</div><input id="slip" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><button id="submit" class="btn">ยืนยันและสร้างคำสั่งซื้อ</button><div id="msg" class="error"></div></section><aside class="card"><h3 style="margin-top:0">สรุปสินค้า</h3><div id="summary"></div><div id="bankbox" class="bankbox"><h3>ช่องทางการโอนเงิน</h3><div class="muted">กำลังโหลดข้อมูลบัญชี...</div></div></aside></div></div>
<script>(()=>{const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),items=ShopCart.read(),summary=document.getElementById('summary'),msg=document.getElementById('msg'),btn=document.getElementById('submit'),fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!items.length){location.replace('cart.html');return}let estimate=0;summary.innerHTML=items.map(x=>{const q=Number(x.quantity)||1,p=Number(x.price)||0;estimate+=q*p;return `<div class="line"><div>${esc(x.product_name)}${x.variant_name?'<div class="muted">'+esc(x.variant_name)+'</div>':''} × ${q}</div><strong>${fmt(q*p)}</strong></div>`}).join('')+`<div class="line"><strong>ประมาณการ</strong><span class="total">${fmt(estimate)}</span></div><div class="muted" style="font-size:12px;margin-top:10px">ยอดจริงจะคำนวณจากราคาปัจจุบันและค่าจัดส่งของระบบครับ</div>`;sb.from('shop_settings').select('bank_name,account_name,account_number,promptpay_id,payment_note').eq('singleton',true).single().then(({data,error})=>{const box=document.getElementById('bankbox');if(error||!data){box.innerHTML='<h3>ช่องทางการโอนเงิน</h3><div class="error">ไม่สามารถโหลดข้อมูลบัญชีได้ กรุณาลองใหม่อีกครั้ง</div>';btn.disabled=true;return}const bank=data.bank_name||'',name=data.account_name||'',number=data.account_number||'';if(!number){box.innerHTML='<h3>ช่องทางการโอนเงิน</h3><div class="error">ยังไม่มีข้อมูลบัญชีรับโอน</div>';btn.disabled=true;return}box.innerHTML='<h3>ช่องทางการโอนเงิน</h3><div class="bankrow"><span>ธนาคาร</span><strong>'+esc(bank)+'</strong></div><div class="bankrow bank-account-row"><span>เลขที่บัญชี</span><button id="copyAccount" class="copy-account" type="button" data-number="'+esc(number)+'"><strong>'+esc(number)+'</strong><small>แตะเพื่อคัดลอก</small></button></div><div class="bankrow"><span>ชื่อบัญชี</span><strong>'+esc(name)+'</strong></div>'+(data.promptpay_id?'<div class="bankrow"><span>PromptPay</span><strong>'+esc(data.promptpay_id)+'</strong></div>':'')+(data.payment_note?'<p class="pay-note">'+esc(data.payment_note)+'</p>':'')+'<div id="copyFeedback" class="copy-feedback" role="status"></div>';box.querySelector('#copyAccount').onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(number);ok=true}catch(e){const t=document.createElement('textarea');t.value=number;document.body.appendChild(t);t.select();try{ok=document.execCommand('copy')}catch(_){}t.remove()}document.getElementById('copyFeedback').textContent=ok?'คัดลอกเลขบัญชีแล้ว':'กรุณากดค้างที่เลขบัญชีเพื่อคัดลอก'};}).catch(()=>{btn.disabled=true;document.getElementById('bankbox').textContent='โหลดข้อมูลบัญชีไม่สำเร็จ'});btn.onclick=async()=>{msg.textContent='';const slip=document.getElementById('slip').files[0];if(!slip){msg.textContent='กรุณาแนบสลิปการโอนก่อนยืนยันคำสั่งซื้อครับ';return}if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(slip.type)||slip.size>10*1024*1024){msg.textContent='กรุณาเลือกไฟล์ JPG, PNG, WebP หรือ PDF ขนาดไม่เกิน 10 MB';return}const customer={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),address:document.getElementById('address').value.trim(),note:document.getElementById('note').value.trim()};if(!customer.name||!customer.phone||!customer.address){msg.textContent='กรุณากรอกชื่อ เบอร์โทร และที่อยู่จัดส่งให้ครบครับ';return}btn.disabled=true;btn.textContent='กำลังสร้างคำสั่งซื้อ...';let orderCreated=false;try{const payload=items.map(x=>({product_id:x.product_id,variant_id:x.variant_id||null,quantity:Number(x.quantity)||1}));const {data,error}=await sb.rpc('create_guest_shop_order',{p_customer:customer,p_items:payload});if(error)throw error;localStorage.setItem('apcncdiy_last_order',JSON.stringify(data));orderCreated=true;ShopCart.clear();const paymentUrl='order-payment.html?id='+encodeURIComponent(data.order_id)+'&token='+encodeURIComponent(data.token);btn.textContent='กำลังอัปโหลดสลิป...';try{const res=await fetch('/api/shop-orders/slip?order_id='+encodeURIComponent(data.order_id)+'&token='+encodeURIComponent(data.token),{method:'POST',headers:{'Content-Type':slip.type,'X-File-Name':encodeURIComponent(slip.name)},body:slip});if(!res.ok){const result=await res.json().catch(()=>({}));throw new Error(result.error||'slip_upload_failed')}location.href=paymentUrl}catch(uploadError){console.error(uploadError);msg.innerHTML='สร้างคำสั่งซื้อสำเร็จแล้ว แต่แนบสลิปไม่สำเร็จ กรุณาไปที่ <a style="color:var(--cyan)" href="'+paymentUrl+'">หน้าชำระเงินของออเดอร์นี้</a> เพื่อแจ้งโอนอีกครั้ง';btn.disabled=true;btn.textContent='สร้างคำสั่งซื้อแล้ว';return}}catch(e){console.error(e);const m=String(e.message||e);msg.textContent=m.includes('insufficient_stock')?'สินค้าบางรายการมีสต็อกไม่เพียงพอ กรุณากลับไปตรวจตะกร้าครับ':m.includes('price_not_available')?'สินค้าบางรายการยังไม่มีราคา จึงยังสั่งซื้อไม่ได้ครับ':'สร้างคำสั่งซื้อไม่สำเร็จ กรุณาตรวจข้อมูลแล้วลองใหม่ครับ'}finally{if(!orderCreated){btn.disabled=false;btn.textContent='ยืนยันและสร้างคำสั่งซื้อ'}}}})();</script></body></html>
