<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สั่งซื้อสินค้า · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}.shell{width:min(1050px,calc(100% - 28px));margin:auto;padding:26px 0 50px}.layout{display:grid;grid-template-columns:1fr 360px;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.field{display:grid;gap:6px;margin-bottom:11px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#101923;color:var(--ink);border-radius:8px;padding:10px 11px;font:inherit}.field textarea{min-height:110px}.muted{color:var(--muted)}.btn{width:100%;min-height:44px;border:1px solid var(--amber);border-radius:8px;background:var(--amber);color:#171006;font:700 16px Kanit;cursor:pointer}.btn:disabled{opacity:.55}.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #293845}.error{color:var(--red);margin-top:10px}.total{font-size:22px;color:var(--amber);font-weight:700}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head>
<body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="shop-cart.js"></script><div class="shell"><h1>ข้อมูลจัดส่ง</h1><div class="layout"><section class="card"><div class="field"><label>ชื่อผู้รับ *</label><input id="name" autocomplete="name"></div><div class="field"><label>เบอร์โทร *</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>อีเมล</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>ที่อยู่จัดส่ง *</label><textarea id="address" autocomplete="street-address"></textarea></div><div class="field"><label>หมายเหตุ</label><textarea id="note"></textarea></div><button id="submit" class="btn">สร้างคำสั่งซื้อ</button><div id="msg" class="error"></div></section><aside class="card"><h3 style="margin-top:0">สรุปสินค้า</h3><div id="summary"></div></aside></div></div>
<script>(()=>{const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),items=ShopCart.read(),summary=document.getElementById('summary'),msg=document.getElementById('msg'),btn=document.getElementById('submit'),fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!items.length){location.replace('cart.html');return}let estimate=0;summary.innerHTML=items.map(x=>{const q=Number(x.quantity)||1,p=Number(x.price)||0;estimate+=q*p;return `<div class="line"><div>${esc(x.product_name)}${x.variant_name?'<div class="muted">'+esc(x.variant_name)+'</div>':''} × ${q}</div><strong>${fmt(q*p)}</strong></div>`}).join('')+`<div class="line"><strong>ประมาณการ</strong><span class="total">${fmt(estimate)}</span></div><div class="muted" style="font-size:12px;margin-top:10px">ยอดจริงจะคำนวณจากราคาปัจจุบันและค่าจัดส่งของระบบครับ</div>`;btn.onclick=async()=>{msg.textContent='';const customer={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),address:document.getElementById('address').value.trim(),note:document.getElementById('note').value.trim()};if(!customer.name||!customer.phone||!customer.address){msg.textContent='กรุณากรอกชื่อ เบอร์โทร และที่อยู่จัดส่งให้ครบครับ';return}btn.disabled=true;btn.textContent='กำลังสร้างคำสั่งซื้อ...';try{const payload=items.map(x=>({product_id:x.product_id,variant_id:x.variant_id||null,quantity:Number(x.quantity)||1}));const {data,error}=await sb.rpc('create_guest_shop_order',{p_customer:customer,p_items:payload});if(error)throw error;localStorage.setItem('apcncdiy_last_order',JSON.stringify(data));ShopCart.clear();location.href='order-payment.html?id='+encodeURIComponent(data.order_id)+'&token='+encodeURIComponent(data.token)}catch(e){console.error(e);const m=String(e.message||e);msg.textContent=m.includes('insufficient_stock')?'สินค้าบางรายการมีสต็อกไม่เพียงพอ กรุณากลับไปตรวจตะกร้าครับ':m.includes('price_not_available')?'สินค้าบางรายการยังไม่มีราคา จึงยังสั่งซื้อไม่ได้ครับ':'สร้างคำสั่งซื้อไม่สำเร็จ กรุณาตรวจข้อมูลแล้วลองใหม่ครับ'}finally{btn.disabled=false;btn.textContent='สร้างคำสั่งซื้อ'}}})();</script></body></html>
