<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AP CNC DIY</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    :root{--bg:#0d1218;--panel:#161e27;--panel2:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--amber:#f6a623;--cyan:#25c8d5}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--ink)}
    body{display:block;overflow:auto}
    button,input,select,textarea{font-family:'Kanit',sans-serif}
    a{color:var(--cyan)}
    .shell{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:28px 0}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-logo{width:42px;height:42px;border-radius:9px;background:#fff;object-fit:contain;box-shadow:0 0 10px #fff3;flex:0 0 auto}
    .brand-copy{min-width:0}
    .muted{color:var(--muted)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 14px 34px #0006}
    .entry-card{display:block;text-decoration:none;margin-top:20px;transition:border-color .15s,transform .15s,background .15s}
    .entry-card:hover{border-color:var(--cyan);transform:translateY(-1px);background:#18232e}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
    .btn-accent{background:var(--amber);border-color:var(--amber);color:#1a1206}
    .account-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0;margin-left:auto}
    .account-email{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;text-align:right}
    .card h1{margin-top:0}.card h2{color:var(--cyan)}
    @media(max-width:600px){
      .topbar{align-items:flex-start;flex-direction:row;gap:10px}
      .brand{flex:1 1 auto;align-items:center}
      .brand-logo{width:42px;height:42px}
      .brand-copy strong{display:block;font-size:15px;line-height:1.15}
      .brand-copy .muted{font-size:11px;line-height:1.25;margin-top:4px}
      .account-actions{flex:0 0 auto;max-width:48%;flex-wrap:wrap;gap:5px;justify-content:flex-end}
      .account-email{order:0;width:100%;max-width:100%;font-size:10px;line-height:1.2}
      .account-actions .btn{order:1;min-height:36px;padding:0 10px;font-size:11px}
    }
    @media(max-width:430px){
      .shell{width:min(100% - 20px,1100px);padding-top:20px}
      .topbar{gap:8px}
      .brand{gap:9px}
      .brand-copy .muted{max-width:175px}
      .account-actions{max-width:50%}
      .account-actions .btn{padding:0 8px;font-size:10.5px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/ap-cnc-diy-logo.jpg" alt="AP CNC DIY">
        <div class="brand-copy"><strong>AP CNC DIY</strong><div class="muted">CNC · Furniture · AP Cabinet Pro</div></div>
      </div>
      <div class="account-actions">
        <span id="accountEmail" class="account-email" hidden></span>
        <a id="accountButton" class="btn btn-accent" href="login.html">เข้าสู่ระบบ/สมัครสมาชิค</a>
      </div>
    </div>
    <main class="card">
      <h1>APcncDIY.com</h1>
      <p class="muted">เว็บไซต์หลักสำหรับ AP Cabinet Pro และระบบสมาชิก AP CNC DIY</p>
      <a class="card entry-card" href="ap-cabinet-pro.html">
        <h2>AP Cabinet Pro</h2>
        <p class="muted">ตรวจสอบแพ็กเกจ ต่ออายุ และเข้าสู่ระบบ</p>
      </a>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth-client.js"></script>
  <script>
    (() => {
      const button = document.getElementById('accountButton');
      const email = document.getElementById('accountEmail');
      if (!button || !email || !window.AuthClient) return;

      function render(user) {
        if (user && user.email) {
          email.textContent = user.email;
          email.hidden = false;
          button.textContent = 'ออกจากระบบ';
          button.href = '#';
          button.dataset.mode = 'logout';
        } else {
          email.textContent = '';
          email.hidden = true;
          button.textContent = 'เข้าสู่ระบบ/สมัครสมาชิค';
          button.href = 'login.html';
          button.dataset.mode = 'login';
        }
      }

      button.addEventListener('click', async (event) => {
        if (button.dataset.mode !== 'logout') return;
        event.preventDefault();
        button.setAttribute('aria-busy', 'true');
        button.style.pointerEvents = 'none';
        try {
          await window.AuthClient.sb.auth.signOut();
        } catch (error) {
          console.warn('ออกจากระบบไม่สำเร็จ', error);
        } finally {
          button.removeAttribute('aria-busy');
          button.style.pointerEvents = '';
          render(null);
        }
      });

      window.AuthClient.getUser().then(render).catch(() => render(null));
      if (window.AuthClient.sb && window.AuthClient.sb.auth) {
        window.AuthClient.sb.auth.onAuthStateChange((_event, session) => render(session && session.user ? session.user : null));
      }
    })();
  </script>
</body>
</html>
