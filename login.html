<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Cabinet Pro · เข้าสู่ระบบ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script></head><body><div class="shell" style="max-width:430px"><main class="card"><div class="brand" style="justify-content:center;margin-bottom:18px"><span class="brand-mark">AP</span><div><strong>AP Cabinet Pro</strong><div class="muted">APcncDIY.com</div></div></div><div style="display:flex;gap:6px;margin-bottom:14px"><button id="tabLogin" class="btn btn-accent" style="flex:1">เข้าสู่ระบบ</button><button id="tabSignup" class="btn" style="flex:1">สมัครสมาชิก</button></div><div class="field"><label>อีเมล</label><input id="email" type="email" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password"></div><div id="password2Wrap" class="field hidden" style="margin-top:10px"><label>ยืนยันรหัสผ่าน</label><input id="password2" type="password"></div><button id="submit" class="btn btn-accent" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button><button id="forgot" class="btn" style="width:100%;margin-top:8px">ลืมรหัสผ่าน?</button><div id="status" class="status" style="margin-top:12px"></div><div id="member" class="hidden"><hr style="border-color:var(--line)"><h3>สถานะสมาชิก</h3><p id="memberInfo" class="muted"></p><a class="btn btn-accent" href="membership.html">ดูแพ็กเกจสมาชิก</a> <button id="logout" class="btn">ออกจากระบบ</button></div></main></div><script>(()=>{const LOGIN_URL='https://apcncdiy.com/login.html';const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let mode='login';const $=id=>document.getElementById(id);function setMode(m){mode=m;$('tabLogin').classList.toggle('btn-accent',m==='login');$('tabSignup').classList.toggle('btn-accent',m==='signup');$('password2Wrap').classList.toggle('hidden',m!=='signup');$('submit').textContent=m==='signup'?'สมัครสมาชิก':m==='forgot'?'ส่งลิงก์เปลี่ยนรหัสผ่าน':'เข้าสู่ระบบ';$('forgot').textContent=m==='forgot'?'← กลับไปเข้าสู่ระบบ':'ลืมรหัสผ่าน?';$('status').textContent=''}async function showMember(session){if(!session?.user){$('member').classList.add('hidden');return}const r=await sb.from('profiles').select('status,expires_at,role').eq('id',session.user.id).maybeSingle();const p=r.data||{};const expiry=p.expires_at?Date.parse(p.expires_at):0;const active=p.role==='admin'||p.status==='active'&&(!expiry||expiry>=Date.now());$('member').classList.remove('hidden');$('memberInfo').textContent=`${session.user.email} · ${active?'ใช้งานได้':expiry&&expiry<Date.now()?'หมดอายุ':p.status||'รออนุมัติ'}`;if(active){const next=new URLSearchParams(location.search).get('next');if(next)setTimeout(()=>location.href=next,300)}}$('tabLogin').onclick=()=>setMode('login');$('tabSignup').onclick=()=>setMode('signup');$('forgot').onclick=()=>setMode(mode==='forgot'?'login':'forgot');$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;$('status').textContent='กำลังดำเนินการ...';try{if(mode==='forgot'){const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:LOGIN_URL});if(r.error)throw r.error;$('status').className='status ok';$('status').textContent='ส่งลิงก์เปลี่ยนรหัสผ่านแล้ว';return}if(mode==='signup'){if(password!==$('password2').value)throw Error('รหัสผ่านทั้งสองช่องไม่ตรงกัน');const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:LOGIN_URL}});if(r.error)throw r.error;$('status').className='status ok';$('status').textContent='สมัครสำเร็จ กรุณายืนยันอีเมล';return}const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;$('status').textContent='';showMember(r.data.session)}catch(e){$('status').className='status err';$('status').textContent=e.message||'ดำเนินการไม่สำเร็จ'}};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.getSession().then(r=>showMember(r.data.session));})();</script></body></html>
