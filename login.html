 17px}.auth-member-grid{display:grid;gap:9px;margin-bottom:17px}.auth-member-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #2d3946;padding-bottom:7px}.auth-member-row span:first-child{color:var(--auth-muted)}.auth-member-row span:last-child{text-align:right;font-weight:700;word-break:break-word}.auth-member-row .active{color:var(--auth-green)}.auth-member-row .expired,.auth-member-row .suspended{color:var(--auth-red)}.auth-purchase{margin-bottom:8px}.auth-latest{margin-top:18px;padding-top:14px;border-top:1px solid var(--auth-line);font-size:11px;color:var(--auth-muted);text-align:center}.auth-latest strong{color:var(--auth-ink);font-size:12px}.auth-latest a{display:block;margin-top:5px;text-decoration:none}.auth-latest a.disabled{opacity:.55;pointer-events:none}.auth-foot{text-align:center;color:#738291;font-size:10px;margin-top:15px}

<script>
(()=>{
  const emailKey='ap_cabinet_last_email';
  const readEmail=()=>{try{return localStorage.getItem(emailKey)||''}catch(_e){return''}};
  const saveEmail=()=>{const el=document.getElementById('authEmail');if(!el)return;try{const value=el.value.trim();if(value)localStorage.setItem(emailKey,value)}catch(_e){}};
  const init=()=>{
    const email=document.getElementById('authEmail'),password=document.getElementById('authPassword'),password2=document.getElementById('authPassword2'),submit=document.getElementById('authSubmit');
    if(!email||!password||!submit)return;
    if(!email.value)email.value=readEmail();
    email.addEventListener('input',saveEmail);
    submit.addEventListener('click',saveEmail);
    [email,password,password2].forEach(field=>field&&field.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!event.isComposing){event.preventDefault();saveEmail();if(!submit.disabled)submit.click()}
    }));
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

 function renderLineGroup(){const box=$('authLineGroup'),target=$('authLineQr');if(!box||!target)return;box.classList.toggle('auth-hidden',!memberActive||!lineGroupUrl);target.textContent='';if(!memberActive||!lineGroupUrl||typeof qrcode!=='function')return;try{const qr=qrcode(0,'M');qr.addData(lineGroupUrl);qr.make();const img=document.createElement('img');img.src=qr.createDataURL(5,8);img.alt='QR Code กลุ่ม LINE';target.appendChild(img)}catch(_e){box.classList.add('auth-hidden')}}

(function(){
  if(window.parent===window)return;
  var installed=document.getElementById('authInstalledVersion');
  if(installed&&installed.textContent==='เว็บ')installed.textContent='กำลังตรวจสอบ...';
  window.addEventListener('message',function(event){
    if(event.source!==window.parent)return;
    var msg=event.data||{};
    if(msg.protocol===1&&msg.type==='AP_CABINET_PLUGIN_VERSION'&&msg.version){
      var el=document.getElementById('authInstalledVersion');
      if(el)el.textContent='AP Cabinet Pro '+msg.version;
    }
  });
  window.parent.postMessage({type:'AP_GCODE_VERSION_REQUEST',protocol:1},'*');
  setTimeout(function(){if(installed&&installed.textContent==='กำลังตรวจสอบ...')installed.textContent='เว็บ';},2500);
})();
