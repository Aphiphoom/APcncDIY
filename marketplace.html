<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--panel2:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--green:#45c98a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:42px;height:42px;border-radius:9px;background:#fff;object-fit:contain}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);font-weight:700}.btn-cyan{border-color:var(--cyan);color:var(--cyan)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0006}.hero{padding:24px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:32px;color:var(--cyan)}.hero p{margin:0;line-height:1.7}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;margin-top:18px}.control{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);padding:0 13px}.seller-directory-btn{grid-column:2;min-height:44px;border-color:var(--cyan);color:var(--cyan);background:#12202a}.summary{display:flex;justify-content:space-between;gap:10px;margin:14px 2px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{overflow:hidden;display:flex;flex-direction:column;min-height:100%;transition:.15s}.product:hover{border-color:var(--cyan);transform:translateY(-2px)}.cover{aspect-ratio:4/3;background:#0a1219;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden;padding:8px}.cover img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{padding:18px;text-align:center;color:#6e7d8c}.body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}.meta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:19px;font-weight:700;line-height:1.35;margin:0}.category{font-size:11px;padding:4px 8px;border-radius:999px;background:#23313d;color:var(--cyan);border:1px solid #314656;white-space:nowrap}.description{color:var(--muted);font-size:13px;line-height:1.55}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px;color:var(--muted)}.stat{padding:7px 9px;border:1px solid #2f3b48;border-radius:7px;background:#121a22}.seller{margin-top:auto;font-size:12px;color:var(--muted)}.foot{display:flex;justify-content:space-between;gap:10px;align-items:center}.lead{font-size:13px;font-weight:600;color:var(--green)}.empty,.error{grid-column:1/-1;padding:34px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{width:min(100% - 20px,1180px);padding-top:20px}.hero{padding:20px}.toolbar{grid-template-columns:1fr}.seller-directory-btn{grid-column:1}.grid{grid-template-columns:1fr}.summary{flex-direction:column}}</style></head>
<body><div class="shell"><div class="topbar"><a class="brand" href="ap-cabinet-pro.html"><img class="brand-logo" src="assets/ap-cnc-diy-logo.jpg"><div><strong>AP CNC DIY</strong><div class="muted">AP Cabinet Pro Marketplace</div></div></a><a class="btn" href="ap-cabinet-pro.html">กลับ AP Cabinet Pro</a></div><section class="card hero"><h1>Marketplace</h1><p class="muted">ค้นหาแบบตู้และผลงานจากสมาชิก AP Cabinet Pro เพื่อสอบถามและจ้างผลิตงานจริง</p><div class="toolbar"><input id="searchInput" class="control" type="search" placeholder="ค้นหาชุดตู้ หมวดหมู่ หรือผู้ผลิต..."><select id="categorySelect" class="control"><option value="">ทุกหมวดหมู่</option></select><a class="btn seller-directory-btn" href="sellers.html">รายชื่อผู้ขาย</a></div></section><div class="summary"><div id="resultSummary">กำลังโหลด Marketplace...</div></div><main id="productGrid" class="grid"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="auth-client.js"></script><script src="site-header.js"></script><script src="marketplace-storage.js"></script><script>(()=>{const grid=document.getElementById('productGrid'),summary=document.getElementById('resultSummary'),searchInput=document.getElementById('searchInput'),categorySelect=document.getElementById('categorySelect');let models=[],sellers=new Map();const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const file=p=>window.MarketplaceStorage.url(p);const num=v=>Number(v||0).toLocaleString('th-TH');const dims=m=>{const d=m.dimensions_mm||{};return `${num(d.width)} × ${num(d.height)} × ${num(d.depth)} มม.`};const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function render(){const q=searchInput.value.trim().toLocaleLowerCase('th'),cat=categorySelect.value;const rows=models.filter(m=>{const seller=sellers.get(m.seller_id)?.display_name||'';return(!cat||m.category===cat)&&(!q||[m.title,m.description,m.category,seller].join(' ').toLocaleLowerCase('th').includes(q))});summary.textContent=`พบ ${rows.length.toLocaleString('th-TH')} ผลงาน`;if(!rows.length){grid.innerHTML='<div class="card empty">ยังไม่มีผลงานที่ตรงกับการค้นหา</div>';return}grid.innerHTML=rows.map(m=>{const seller=sellers.get(m.seller_id)?.display_name||'สมาชิก AP Cabinet Pro',cover=file(m.cover_path);return`<a class="card product" href="marketplace-item.html?id=${encodeURIComponent(m.id)}"><div class="cover">${cover?`<img src="${esc(cover)}" alt="${esc(m.title)}" loading="lazy">`:'<div class="placeholder">ยังไม่มีภาพปก</div>'}</div><div class="body"><div class="meta"><h2 class="title">${esc(m.title)}</h2><span class="category">${esc(m.category||'อื่น ๆ')}</span></div><div class="description">${esc((m.description||'').trim()||'เปิดดูรายละเอียดผลงานและติดต่อผู้ผลิตเพื่อสอบถามงาน')}</div><div class="stats"><div class="stat">ขนาดอ้างอิง<br><strong>${esc(dims(m))}</strong></div><div class="stat">ผู้ผลิต<br><strong>${esc(seller)}</strong></div></div><div class="seller">ผลงานโดย ${esc(seller)}</div><div class="foot"><div class="lead">โมเดล: ${Number(m.price_credits||0)>0?num(m.price_credits)+' เครดิต':'ฟรี'}</div><span class="btn btn-cyan">ดูรายละเอียด</span></div></div></a>`}).join('')}async function load(){const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data,error}=await sb.from('market_models').select('id,seller_id,title,description,category,dimensions_mm,cover_path,preview_path,price_credits,created_at').eq('status','published').order('created_at',{ascending:false});if(error)throw error;models=shuffle(data||[]);const ids=[...new Set(models.map(x=>x.seller_id))];if(ids.length){const r=await sb.from('public_profiles').select('user_id,display_name,is_public').in('user_id',ids).eq('is_public',true);if(!r.error)sellers=new Map((r.data||[]).map(x=>[x.user_id,x]))}const cats=[...new Set(models.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));categorySelect.insertAdjacentHTML('beforeend',cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(''));render()}searchInput.addEventListener('input',render);categorySelect.addEventListener('change',render);load().catch(e=>{console.error(e);summary.textContent='โหลด Marketplace ไม่สำเร็จ';grid.innerHTML='<div class="card error">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>'})})();</script></body></html>
