<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ยืนยันการสั่งซื้อสมาชิก · AP Cabinet Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    :root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--red:#ff9a9a;--green:#45c98a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}
    .shell{width:min(980px,calc(100% - 28px));margin:auto;padding:28px 0 56px}
    .top{margin-bottom:18px}.top h1{margin:0 0 6px;font-size:28px}.muted{color:var(--muted)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px}
    .field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;color:#cbd5dd}
    .field input,.field textarea{width:100%;border:1px solid var(--line);background:#101923;color:var(--ink);border-radius:8px;padding:10px 11px;font:inherit}
    .field textarea{min-height:92px;resize:vertical}
    .btn{display:inline-flex;width:100%;min-height:45px;align-items:center;justify-content:center;border:1px solid var(--amber);border-radius:8px;background:var(--amber);color:#171006;font:700 16px Kanit;cursor:pointer;text-decoration:none}
    .btn:disabled{opacity:.55}.back{display:inline-block;margin-top:12px;color:var(--cyan);text-decoration:none;font-size:13px}
    .plan{padding:16px;background:#101923;border:1px solid var(--line);border-radius:10px}
    .plan-name{font-size:18px;font-weight:700}.plan-price{margin-top:8px;color:var(--amber);font-size:28px;font-weight:800}
    .line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #293845}.line:last-child{border-bottom:0}.bankbox{margin-top:14px;padding:16px;background:#0d151d;border:1px solid var(--line);border-radius:9px}.bankbox h4{margin:0 0 10px;font-size:16px}.bankrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #293845;font-size:13px}.bankrow:last-child{border-bottom:0}.bankrow span{color:var(--muted)}.copy-account{border:1px solid #52697d;border-radius:7px;padding:5px 9px;color:var(--ink);background:#1e2b39;cursor:pointer;font:700 13px Kanit,sans-serif;display:inline-flex;gap:8px;align-items:center;text-align:right;overflow-wrap:anywhere;max-width:100%;touch-action:manipulation}.bankrow.bank-account-row{align-items:center}.bank-account-row>span{flex:0 0 auto}.copy-account{min-width:0;flex:0 1 auto;justify-content:flex-end}.copy-account .account-number{color:var(--ink);white-space:nowrap;overflow-wrap:normal;font-variant-numeric:tabular-nums;letter-spacing:.01em}.copy-account small{flex:0 0 auto}
    @media(max-width:600px){.bank-account-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.bank-account-row>span{font-size:13px}.bank-account-row .copy-account{width:100%;min-height:48px;justify-content:space-between;text-align:left;padding:10px 12px;gap:8px}.bank-account-row .account-number{font-size:clamp(14px,4.1vw,19px);font-weight:700}.bank-account-row .copy-account small{font-size:11px}.bankrow{align-items:center}.bankrow strong{min-width:0;text-align:right}}
    .copy-account:hover,.copy-account:focus-visible{border-color:var(--cyan);outline-color:var(--cyan)}.copy-account small{color:var(--cyan);font-size:11px;font-weight:500;white-space:nowrap}.bank-copy-status{font-size:12px;color:var(--green);margin:8px 0 0;min-height:18px}.slipbox{margin:14px 0;padding:14px;border:1px dashed #52697d;border-radius:9px;background:#101923}.slipbox input{width:100%;margin-top:8px;color:var(--muted)}
    .error{color:var(--red);margin-top:10px;font-size:13px}.note{font-size:12px;line-height:1.65;color:var(--muted);margin-top:12px}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.summary{order:-1}.top h1{font-size:24px}}
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<div class="shell">
  <div class="top"><h1>ยืนยันการสั่งซื้อ</h1><div class="muted">AP Cabinet Pro Membership</div></div>
  <div class="layout">
    <section class="card">
      <div class="field"><label>ชื่อผู้สั่งซื้อ *</label><input id="name" autocomplete="name"></div>
      <div class="field"><label>เบอร์โทร *</label><input id="phone" inputmode="tel" autocomplete="tel"></div>
      <div class="field"><label>อีเมลที่ใช้กับ AP Cabinet Pro *</label><input id="email" type="email" autocomplete="email"></div>
      <div class="field"><label>หมายเหตุ</label><textarea id="note" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea></div>
      <div class="slipbox">
        <strong>แนบสลิปการโอน *</strong>
        <div class="muted" style="font-size:12px;margin-top:3px">รองรับ JPG, PNG, WebP หรือ PDF</div>
        <input id="slip" type="file" accept="image/jpeg,image/png,image/webp,application/pdf">
      </div>
      <button id="submit" class="btn">ยืนยันและสร้างคำสั่งซื้อ</button>
      <div id="msg" class="error"></div>
      <a class="back" href="ap-cabinet-pro.html">← กลับไปเลือกแพ็กเกจ</a>
    </section>
    <aside class="card summary">
      <h3 style="margin-top:0">สรุปแพ็กเกจ</h3>
      <div id="plan" class="plan"></div>
      <div class="note">หลังสร้างคำสั่งซื้อ ระบบจะพาไปหน้าชำระเงินเพื่อแสดงยอดและช่องทางโอนเงิน จากนั้นสามารถแจ้งการโอนได้จากหน้าเดียวกัน</div>
    </aside>
  </div>
</div>
<script>
(()=>{
  const qs=new URLSearchParams(location.search);
  const days=Number(qs.get('days'));
  const plans={
    30:{name:'แพ็กเกจ 30 วัน',price:950},
    90:{name:'แพ็กเกจ 90 วัน',price:2500},
    365:{name:'แพ็กเกจ 365 วัน',price:9500,benefit:'สอนใช้งานและตั้งค่าออนไลน์ฟรี 1 วัน'}
  };
  const selected=plans[days];
  if(!selected){location.replace('ap-cabinet-pro.html');return}
  const fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท';
  const planEl=document.getElementById('plan');
  planEl.innerHTML=
    '<div class="plan-name">'+selected.name+'</div>'+
    (selected.benefit?'<div class="muted" style="margin-top:5px">'+selected.benefit+'</div>':'')+
    '<div class="line" style="margin-top:10px"><span>ราคา</span><strong>'+fmt(selected.price)+'</strong></div>'+
    '<div class="line"><span>ค่าจัดส่ง</span><strong>0 บาท</strong></div>'+
    '<div class="plan-price">'+fmt(selected.price)+'</div>'+
    '<div id="bankbox" class="bankbox"><h4>ช่องทางการโอนเงิน</h4><div class="muted" style="font-size:12px">กำลังโหลดข้อมูลบัญชี...</div></div>';

  const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
  const btn=document.getElementById('submit'),msg=document.getElementById('msg');
  const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  sb.from('shop_settings').select('bank_name,account_name,account_number,promptpay_id').eq('singleton',true).single().then(({data})=>{
    const box=document.getElementById('bankbox'); if(!box)return;
    const bank=data?.bank_name||'ออมสิน', account=data?.account_name||'ร้าน AP CNC DIY', number=data?.account_number||'020376680458', promptpay=data?.promptpay_id||'';
    box.innerHTML='<h4>ช่องทางการโอนเงิน</h4>'+
      '<div class="bankrow"><span>ธนาคาร</span><strong>'+esc(bank)+'</strong></div>'+
      '<div class="bankrow bank-account-row"><span>เลขที่บัญชี</span><button class="copy-account" id="copyBankAccount" type="button" data-account="'+esc(number)+'" aria-label="คัดลอกเลขที่บัญชี '+esc(number)+'"><span class="account-number">'+esc(number)+'</span><small>แตะเพื่อคัดลอก</small></button></div>'+
      '<div class="bankrow"><span>ชื่อบัญชี</span><strong>'+esc(account)+'</strong></div>'+
      (promptpay?'<div class="bankrow"><span>PromptPay</span><strong>'+esc(promptpay)+'</strong></div>':'')+
      '<div id="bankCopyStatus" class="bank-copy-status" role="status" aria-live="polite"></div>';
  }).catch(()=>{});
  async function copyAccountNumber(value){
    if(navigator.clipboard && window.isSecureContext){
      try{await navigator.clipboard.writeText(value);return true}catch(_e){}
    }
    const temp=document.createElement('textarea');
    temp.value=value;temp.setAttribute('readonly','');temp.style.position='fixed';temp.style.opacity='0';
    document.body.appendChild(temp);temp.focus();temp.select();
    let copied=false;
    try{copied=document.execCommand('copy')}catch(_e){}
    temp.remove();return copied;
  }
  document.getElementById('plan').addEventListener('click',async event=>{
    const button=event.target.closest('#copyBankAccount');
    if(!button)return;
    const value=button.dataset.account;
    const copied=await copyAccountNumber(value);
    const status=document.getElementById('bankCopyStatus');
    if(status){status.textContent=copied?'คัดลอกเลขที่บัญชีแล้ว':'คัดลอกอัตโนมัติไม่สำเร็จ กรุณากดค้างที่เลขบัญชีเพื่อคัดลอก';status.style.color=copied?'var(--green)':'var(--red)'}
    const hint=button.querySelector('small');
    if(hint && copied)hint.textContent='คัดลอกแล้ว';
  });
  sb.auth.getSession().then(({data})=>{const e=data?.session?.user?.email;if(e&&!document.getElementById('email').value)document.getElementById('email').value=e}).catch(()=>{});

  btn.onclick=async()=>{
    msg.textContent='';
    const customer={
      name:document.getElementById('name').value.trim(),
      phone:document.getElementById('phone').value.trim(),
      email:document.getElementById('email').value.trim(),
      note:document.getElementById('note').value.trim()
    };
    const slip=document.getElementById('slip').files[0];
    if(!customer.name||!customer.phone||!customer.email){msg.textContent='กรุณากรอกชื่อ เบอร์โทร และอีเมลที่ใช้กับ AP Cabinet Pro ให้ครบครับ';return}
    if(!slip){msg.textContent='กรุณาแนบสลิปการโอนก่อนยืนยันคำสั่งซื้อครับ';return}
    btn.disabled=true;btn.textContent='กำลังสร้างคำสั่งซื้อ...';
    try{
      const {data,error}=await sb.rpc('create_guest_membership_order',{p_customer:customer,p_plan_days:days});
      if(error)throw error;
      localStorage.setItem('apcncdiy_last_order',JSON.stringify(data));
      btn.textContent='กำลังอัปโหลดสลิป...';
      const res=await fetch('/api/shop-orders/slip?order_id='+encodeURIComponent(data.order_id)+'&token='+encodeURIComponent(data.token),{
        method:'POST',
        headers:{'Content-Type':slip.type,'X-File-Name':encodeURIComponent(slip.name)},
        body:slip
      });
      const uploadData=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(uploadData.error||'slip_upload_failed');
      localStorage.setItem('apcncdiy_membership_last_order',JSON.stringify({
        order_id:data.order_id,
        order_no:data.order_no,
        token:data.token,
        total:data.total,
        plan_days:days,
        plan_name:selected.name,
        email:customer.email,
        name:customer.name,
        status:'payment_submitted'
      }));
      location.href='membership-order-success.html?id='+encodeURIComponent(data.order_id)+'&token='+encodeURIComponent(data.token);
    }catch(e){
      console.error(e);
      const t=String(e.message||e);
      msg.textContent=t.includes('membership_account_not_found')?'ไม่พบอีเมลนี้ในระบบสมาชิก AP Cabinet Pro กรุณาตรวจสอบอีเมลที่ใช้สมัครครับ':t.includes('invalid_email')?'กรุณาตรวจสอบอีเมลอีกครั้งครับ':'สร้างคำสั่งซื้อไม่สำเร็จ กรุณาตรวจข้อมูลแล้วลองใหม่ครับ';
    }finally{
      btn.disabled=false;btn.textContent='ยืนยันและสร้างคำสั่งซื้อ';
    }
  };
})();
</script>
</body>
</html>
