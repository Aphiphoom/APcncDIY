<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AP Model Market · 3D Preview</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="ap3d-viewer.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
:root{--g:#087d6b;--ink:#17232c;--muted:#6b7b83;--line:#d8e1e4}*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px 'Kanit',sans-serif;color:var(--ink);background:#d2d2cf}.app{height:100%;position:relative;overflow:hidden}.ap3d-host{position:absolute;inset:0;overflow:hidden;background:#d2d2cf}.ap3d-canvas{display:block;width:100%;height:100%;touch-action:none}.ap3d-tools{position:absolute;z-index:3;left:12px;top:76px;display:grid;gap:4px;padding:5px;background:#ffffffed;border:1px solid #bfc3c5;border-radius:5px;box-shadow:0 3px 11px #0002}.ap3d-tools button{width:36px;height:34px;border:0;border-radius:3px;background:#fff;color:#18262d;font-size:12px;font-weight:700;font-family:'Kanit',sans-serif}.ap3d-tools button.off{opacity:.35}.ap3d-tools button.active{background:var(--g);color:#fff}.bar{position:absolute;z-index:3;left:14px;top:14px;display:flex;align-items:center;gap:9px;background:#ffffffeb;border:1px solid #dde2e5;border-radius:10px;padding:8px 11px;box-shadow:0 4px 15px #27363b17}.mark{width:34px;height:34px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}.bar b,.bar small{display:block}.bar small{color:var(--muted);font-size:11px}.ar-launch{position:absolute;z-index:4;right:14px;top:14px;border:0;border-radius:7px;background:linear-gradient(#42a8dd,#0876b3);box-shadow:0 3px 10px #145d8a33;color:#fff;padding:12px 18px;font-size:14px;font-weight:700;font-family:'Kanit',sans-serif}.ar-engine{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.info{position:absolute;z-index:3;left:14px;bottom:14px;max-width:min(420px,calc(100% - 28px));background:#fffffff0;border:1px solid var(--line);border-radius:9px;padding:9px 12px;box-shadow:0 5px 20px #20322b1c}.info h1{font-size:15px;margin:0 0 3px}.info p{margin:0;color:var(--muted);font-size:11px}.status{position:absolute;z-index:5;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);background:#d2d2cf}.status[hidden]{display:none}@media(max-width:560px){.bar b,.bar small{display:none}.bar{padding:7px}.ap3d-tools{top:66px;left:10px}.info{bottom:10px;left:10px}.info p{display:none}.ar-launch{right:12px;top:12px}}
</style></head><body><div class="app"><div id="ap3dViewer" class="ap3d-host"></div><header class="bar"><span class="mark">AP</span><span><b>AP Model Market</b><small>3D Preview</small></span></header><button id="arButton" class="ar-launch">ดูในพื้นที่จริง</button><div id="status" class="status">กำลังโหลดโมเดล...</div><model-viewer id="arViewer" class="ar-engine" ar ar-scale="fixed" ar-modes="webxr scene-viewer quick-look"></model-viewer><section id="info" class="info" hidden><h1 id="title"></h1><p id="meta"></p></section></div>
<script>
(async()=>{const base='https://modbgnzikhrdvrcxnzqy.supabase.co',key='sb_publishable_55FVfkHoyMRlmiAkTjt5LQ_IbqajFqr',id=new URLSearchParams(location.search).get('id'),status=document.getElementById('status');if(!id){status.textContent='ลิงก์โมเดลไม่ถูกต้อง';return}try{const response=await fetch(`${base}/rest/v1/market_models?select=id,title,category,model_type,placement_type,preview_path,status&id=eq.${encodeURIComponent(id)}&status=eq.published&limit=1`,{headers:{apikey:key},cache:'no-store'});if(!response.ok)throw Error('โหลดข้อมูลไม่สำเร็จ');const model=(await response.json())[0];if(!model||!model.preview_path)throw Error('ไม่พบพรีวิวของโมเดลนี้');const src=`${base}/storage/v1/object/public/market-public/${model.preview_path.split('/').map(encodeURIComponent).join('/')}?v=${Date.now()}`;const start=async()=>{const viewer=new AP3DViewer(document.getElementById('ap3dViewer'));await viewer.load(src);status.hidden=true};if(window.AP3DViewer)await start();else await new Promise((resolve,reject)=>window.addEventListener('ap3d-ready',()=>start().then(resolve,reject),{once:true}));const ar=document.getElementById('arViewer');ar.src=src;document.getElementById('arButton').onclick=()=>ar.activateAR().catch(()=>alert('อุปกรณ์นี้ไม่รองรับ AR'));document.getElementById('title').textContent=model.title;document.getElementById('meta').textContent=[model.category,model.model_type,model.placement_type].filter(Boolean).join(' · ');document.getElementById('info').hidden=false}catch(error){status.textContent=error.message||'เปิดพรีวิวไม่สำเร็จ'}})();
</script></body></html>
