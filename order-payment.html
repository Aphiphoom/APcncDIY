<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ชำระเงิน · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623;--green:#45c98a;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}.shell{width:min(760px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:14px}.muted{color:var(--muted)}.amount{font-size:30px;color:var(--amber);font-weight:700}.bank{font-size:19px;line-height:1.8}.status{padding:10px 12px;border-radius:8px;background:#10271d;border:1px solid #2e6b4c;color:#a9e7c3}.field{margin-top:12px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#101923;color:var(--ink);font:inherit}.btn{width:100%;min-height:44px;margin-top:10px;border:1px solid var(--amber);border-radius:8px;background:var(--amber);color:#171006;font:700 16px Kanit;cursor:pointer}.btn:disabled{opacity:.55}.error{color:var(--red);margin-top:8px}</style></head>
<body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><div class="shell"><div id="root" class="card">กำลังโหลดคำสั่งซื้อ...</div></div>
<script>(()=>{const qs=new URLSearchParams(location.search),id=qs.get('id'),token=qs.get('token'),sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),root=document.getElementById('root'),fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!id||!token)throw new Error('missing order');const [{data:o,error},{data:s,error:se}]=await Promise.all([sb.rpc('get_guest_shop_order',{p_order_id:id,p_token:token}),sb.from('shop_settings').select('*').eq('singleton',true).single()]);if(error)throw error;if(se)throw se;const submitted=o.status==='payment_submitted'||o.status==='paid'||['preparing','shipped','completed'].includes(o.status);root.innerHTML=`<div class="muted">เลขคำสั่งซื้อ</div><h2 style="margin:2px 0 12px">${esc(o.order_no)}</h2><div class="amount">${fmt(o.total)}</div><div class="muted">ยอดรวมที่ต้องโอน</div><hr style="border:0;border-top:1px solid #364454;margin:18px 0"><div class="bank"><strong>${esc(s.bank_name||'ออมสิน')}</strong><br>ชื่อบัญชี: ${esc(s.account_name||'ร้าน AP CNC DIY')}<br>เลขบัญชี: <strong>${esc(s.account_number||'020376680458')}</strong>${s.promptpay_id?'<br>PromptPay: <strong>'+esc(s.promptpay_id)+'</strong>':''}</div>${s.payment_note?'<p class="muted">'+esc(s.payment_note)+'</p>':''}<div style="margin-top:18px">${submitted?'<div class="status">ได้รับสลิปแล้ว สถานะ: '+esc(o.status)+'</div>':`<label>วันที่และเวลาโอน</label><div class="field"><input id="transferAt" type="datetime-local"></div><label style="display:block;margin-top:14px">แนบสลิป (ไม่บังคับ)</label><div class="field"><input id="slip" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><button id="upload" class="btn">แจ้งยืนยันการโอนเงิน</button><div id="msg" class="error"></div>`}</div>`;if(!submitted){document.getElementById('upload').onclick=upload}}async function upload(){const input=document.getElementById('slip'),file=input.files[0],transfer=document.getElementById('transferAt').value,btn=document.getElementById('upload'),msg=document.getElementById('msg');if(!transfer){msg.textContent='กรุณาระบุวันที่และเวลาโอนครับ';return}btn.disabled=true;btn.textContent='กำลังส่งข้อมูล...';msg.textContent='';try{if(file){const res=await fetch('/api/shop-orders/slip?order_id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token)+'&transfer_at='+encodeURIComponent(new Date(transfer).toISOString()),{method:'POST',headers:{'Content-Type':file.type,'X-File-Name':encodeURIComponent(file.name)},body:file});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'upload_failed')}else{const {error}=await sb.rpc('confirm_guest_shop_payment',{p_order_id:id,p_token:token,p_transfer_at:new Date(transfer).toISOString()});if(error)throw error}await load()}catch(e){console.error(e);msg.textContent='แจ้งการโอนไม่สำเร็จ กรุณาตรวจข้อมูลแล้วลองใหม่ครับ'}finally{btn.disabled=false;btn.textContent='แจ้งยืนยันการโอนเงิน'}}load().catch(e=>{console.error(e);root.textContent='ไม่พบคำสั่งซื้อหรือข้อมูลสำหรับเปิดรายการนี้ไม่ถูกต้องครับ'})})();</script></body></html>
