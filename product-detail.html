<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายละเอียดสินค้า · AP CNC DIY</title><style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit',sans-serif}button{font:inherit}a{text-decoration:none;color:inherit}.shell{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.back{display:inline-flex;margin-bottom:16px;color:var(--cyan)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:22px}.cover{background:#0a1118;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.cover img{width:100%;height:auto;max-height:none;display:block;object-fit:contain}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#0a1118;border-radius:8px;border:1px solid var(--line);cursor:pointer}.title{font-size:30px;margin:0 0 8px}.price{font-size:24px;color:var(--amber);font-weight:700;margin:12px 0}.muted{color:var(--muted)}.description{line-height:1.8;white-space:pre-line}.specs{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.spec-row{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #263542}.loading{text-align:center;color:var(--muted);padding:60px}.variant-block{margin:18px 0}.variant-title{font-size:14px;color:#cbd6df;margin-bottom:8px}.variant-list{display:grid;gap:8px}.variant-btn{width:100%;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:#111922;color:var(--ink);text-align:left;cursor:pointer}.variant-btn:hover,.variant-btn.active{border-color:var(--cyan);background:#16242d}.variant-btn img{width:56px;height:48px;object-fit:contain;background:#0a1118;border:1px solid #2d3d4b;border-radius:7px}.variant-btn .vname{font-weight:700}.variant-btn .vprice{color:var(--amber);font-weight:700;white-space:nowrap}.variant-noimg{width:56px;height:48px;border:1px solid #2d3d4b;border-radius:7px;background:#0a1118}.selected-label{font-size:13px;color:var(--cyan);margin-top:7px}@media(max-width:760px){.layout{grid-template-columns:1fr}.spec-row{grid-template-columns:110px 1fr}.title{font-size:24px}.variant-btn{grid-template-columns:52px minmax(0,1fr)}.variant-btn .vprice{grid-column:2}.variant-btn img,.variant-noimg{width:50px;height:44px}}</style></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="auth-client.js"></script><script src="site-header.js"></script><div class="shell"><a class="back" href="products.html">← กลับหน้าสินค้า</a><div id="root" class="loading">กำลังโหลดสินค้า...</div></div><script>(()=>{const root=document.getElementById('root'),sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=p=>p?`${window.SUPABASE_URL}/storage/v1/object/public/site-products/${String(p).split('/').map(encodeURIComponent).join('/')}`:'';const fmt=v=>Number(v).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2})+' บาท';async function load(){if(!id)throw new Error('missing id');const [{data:p,error},{data:variants,error:ve}]=await Promise.all([sb.from('site_products').select('*').eq('id',id).eq('is_published',true).single(),sb.from('site_product_variants').select('*').eq('product_id',id).eq('is_active',true).order('sort_order').order('created_at')]);if(error)throw error;if(ve)throw ve;const vs=variants||[],paths=[p.cover_path,...(Array.isArray(p.image_paths)?p.image_paths:[])].filter(Boolean),baseImage=paths[0]?img(paths[0]):'',specs=p.specs&&typeof p.specs==='object'?Object.entries(p.specs):[],basePrice=p.price==null?null:Number(p.price);root.className='card';root.innerHTML=`<div class="layout"><div><div class="cover">${baseImage?`<img id="mainImage" src="${esc(baseImage)}" alt="${esc(p.name)}">`:'<span class="muted">ยังไม่มีรูป</span>'}</div>${paths.length>1?`<div class="gallery">${paths.map(x=>`<img src="${esc(img(x))}" data-src="${esc(img(x))}">`).join('')}</div>`:''}</div><div><h1 class="title">${esc(p.name)}</h1><div class="muted">${esc(p.short_description||'')}</div><div id="price" class="price">${basePrice==null?'สอบถามราคา':fmt(basePrice)} ${p.price_note?`<small>${esc(p.price_note)}</small>`:''}</div>${vs.length?`<div class="variant-block"><div class="variant-title">เลือกตัวเลือก</div><div class="variant-list">${vs.map((v,i)=>`<button class="variant-btn${i===0?' active':''}" type="button" data-variant-id="${v.id}" data-image="${esc(v.image_path?img(v.image_path):'')}" data-price="${v.price==null?'':Number(v.price)}"><span>${v.image_path?`<img src="${esc(img(v.image_path))}" alt="${esc(v.name)}">`:'<span class="variant-noimg"></span>'}</span><span class="vname">${esc(v.name)}</span><span class="vprice">${v.price==null?(basePrice==null?'สอบถามราคา':fmt(basePrice)):fmt(v.price)}</span></button>`).join('')}</div><div id="selectedVariant" class="selected-label"></div></div>`:''}<div class="description">${esc(p.description||'')}</div>${specs.length?`<div class="specs"><h3>รายละเอียดสินค้า</h3>${specs.map(([k,v])=>`<div class="spec-row"><div class="muted">${esc(k)}</div><div>${esc(v)}</div></div>`).join('')}</div>`:''}</div></div>`;root.querySelectorAll('.gallery img').forEach(el=>el.onclick=()=>{const main=document.getElementById('mainImage');if(main)main.src=el.dataset.src});const buttons=[...root.querySelectorAll('.variant-btn')];function selectVariant(btn){buttons.forEach(x=>x.classList.toggle('active',x===btn));const main=document.getElementById('mainImage'),price=document.getElementById('price'),label=document.getElementById('selectedVariant');if(btn.dataset.image&&main)main.src=btn.dataset.image;else if(baseImage&&main)main.src=baseImage;const vp=btn.dataset.price===''?basePrice:Number(btn.dataset.price);if(price)price.innerHTML=`${vp==null?'สอบถามราคา':fmt(vp)} ${p.price_note?`<small>${esc(p.price_note)}</small>`:''}`;if(label)label.textContent='ตัวเลือก: '+btn.querySelector('.vname').textContent}buttons.forEach(b=>b.onclick=()=>selectVariant(b));if(buttons.length)selectVariant(buttons[0])}load().catch(e=>{console.error(e);root.className='card';root.textContent='ไม่พบสินค้าหรือสินค้านี้ยังไม่เปิดเผย'})})();</script></body></html>
