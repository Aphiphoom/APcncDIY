<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายละเอียดสินค้า · AP CNC DIY</title><style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit',sans-serif}a{text-decoration:none;color:inherit}.shell{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.back{display:inline-flex;margin-bottom:16px;color:var(--cyan)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:22px}.cover{aspect-ratio:4/3;background:#0a1118;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:contain}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}.title{font-size:30px;margin:0 0 8px}.price{font-size:24px;color:var(--amber);font-weight:700;margin:12px 0}.muted{color:var(--muted)}.description{line-height:1.8;white-space:pre-line}.specs{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.spec-row{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #263542}.loading{text-align:center;color:var(--muted);padding:60px}@media(max-width:760px){.layout{grid-template-columns:1fr}.spec-row{grid-template-columns:110px 1fr}.title{font-size:24px}}</style></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="auth-client.js"></script><script src="site-header.js"></script><div class="shell"><a class="back" href="products.html">← กลับหน้าสินค้า</a><div id="root" class="loading">กำลังโหลดสินค้า...</div></div><script>(()=>{const root=document.getElementById('root'),sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=p=>p?`${window.SUPABASE_URL}/storage/v1/object/public/site-products/${String(p).split('/').map(encodeURIComponent).join('/')}`:'';async function load(){if(!id)throw new Error('missing id');const {data:p,error}=await sb.from('site_products').select('*').eq('id',id).eq('is_published',true).single();if(error)throw error;const paths=[p.cover_path,...(Array.isArray(p.image_paths)?p.image_paths:[])].filter(Boolean);const specs=p.specs&&typeof p.specs==='object'?Object.entries(p.specs):[];root.className='card';root.innerHTML=`<div class="layout"><div><div class="cover">${paths[0]?`<img id="mainImage" src="${esc(img(paths[0]))}" alt="${esc(p.name)}">`:'<span class="muted">ยังไม่มีรูป</span>'}</div>${paths.length>1?`<div class="gallery">${paths.map(x=>`<img src="${esc(img(x))}" data-src="${esc(img(x))}">`).join('')}</div>`:''}</div><div><h1 class="title">${esc(p.name)}</h1><div class="muted">${esc(p.short_description||'')}</div><div class="price">${p.price==null?'สอบถามราคา':Number(p.price).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2})+' บาท'} ${p.price_note?`<small>${esc(p.price_note)}</small>`:''}</div><div class="description">${esc(p.description||'')}</div>${specs.length?`<div class="specs"><h3>รายละเอียดสินค้า</h3>${specs.map(([k,v])=>`<div class="spec-row"><div class="muted">${esc(k)}</div><div>${esc(v)}</div></div>`).join('')}</div>`:''}</div></div>`;root.querySelectorAll('.gallery img').forEach(el=>el.onclick=()=>{const main=document.getElementById('mainImage');if(main)main.src=el.dataset.src})}load().catch(e=>{console.error(e);root.className='card';root.textContent='ไม่พบสินค้าหรือสินค้านี้ยังไม่เปิดเผย'})})();</script></body></html>
