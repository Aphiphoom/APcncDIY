<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สินค้า · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--soft:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.shell{width:min(1280px,calc(100% - 28px));margin:auto;padding:24px 0 50px}.hero{padding:22px 0 18px}.hero h1{margin:0;color:var(--cyan);font-size:34px}.hero p{color:var(--muted);margin:8px 0 0}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.sidebar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px}.sidebar{padding:14px;align-self:start;position:sticky;top:14px}.side-title{font-weight:700;margin:2px 4px 10px}.cat,.subcat{display:block;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-radius:8px}.cat{padding:10px 11px;font-weight:600}.cat:hover,.cat.active,.subcat:hover,.subcat.active{background:var(--soft);color:var(--cyan)}.children{display:none;padding:0 0 6px 14px}.group.open .children{display:block}.subcat{padding:8px 10px;font-size:13px;color:#cbd6df}.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;height:44px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:0 13px;font:inherit}.count{color:var(--muted);font-size:13px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}.card:hover{border-color:var(--cyan);transform:translateY(-2px)}.cover{background:#0a1118;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}.cover img{width:100%;height:auto;max-height:none;display:block;object-fit:contain}.empty-cover{min-height:220px;display:grid;place-items:center;color:#657687}.body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.name{font-size:18px;font-weight:700}.desc{font-size:13px;line-height:1.55;color:var(--muted);min-height:42px}.variant-count{font-size:12px;color:var(--cyan)}.price{margin-top:auto;color:var(--amber);font-size:17px;font-weight:700}.empty{padding:35px;text-align:center;color:var(--muted);grid-column:1/-1;border:1px dashed var(--line);border-radius:12px}.panel{padding:16px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.panel{padding:10px}.body{padding:10px;gap:5px}.name{font-size:14px;line-height:1.35}.desc{font-size:11px;line-height:1.4;min-height:31px}.variant-count{font-size:10px}.price{font-size:14px}.hero h1{font-size:28px}}</style></head>
<body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="auth-client.js"></script><script src="product-storage.js"></script><script src="shop-cart.js"></script><script src="site-header.js"></script>
<div class="shell"><section class="hero"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>สินค้า</h1><p>สินค้า เครื่องมือ และอุปกรณ์สำหรับงาน CNC และงานเฟอร์นิเจอร์</p></div><a href="cart.html" style="padding:9px 13px;border:1px solid var(--cyan);border-radius:8px;color:var(--cyan);white-space:nowrap">ตะกร้า <span id="cartCount">0</span></a></div></section><div class="layout"><aside class="sidebar"><div class="side-title">หมวดสินค้า</div><button class="cat active" data-id="">สินค้าทั้งหมด</button><div id="categoryTree"></div></aside><main class="panel"><div class="toolbar"><input id="search" class="search" type="search" placeholder="ค้นหาสินค้า..."></div><div id="count" class="count">กำลังโหลด...</div><div id="grid" class="grid"></div></main></div></div>
<script>(()=>{const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),tree=document.getElementById('categoryTree'),grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search');let cats=[],items=[],variants=[],selected='';const cartCount=document.getElementById('cartCount');const refreshCart=()=>{if(cartCount)cartCount.textContent=window.ShopCart?ShopCart.count().toLocaleString('th-TH'):'0'};refreshCart();window.addEventListener('apcartchange',refreshCart);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=window.ProductImageStorage.url;const variantsOf=id=>variants.filter(v=>v.product_id===id);function descendants(id){const out=[id];for(const c of cats.filter(x=>x.parent_id===id))out.push(...descendants(c.id));return out}function renderTree(){const roots=cats.filter(c=>!c.parent_id);tree.innerHTML=roots.map(r=>`<div class="group"><button class="cat" data-id="${r.id}"><span>${esc(r.name)}</span></button><div class="children">${cats.filter(c=>c.parent_id===r.id).map(c=>`<button class="subcat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-id]').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.dataset.id||'';if(b.classList.contains('cat')&&b.closest('.group'))b.closest('.group').classList.toggle('open');renderProducts()})}function productPrice(p){const vs=variantsOf(p.id),vp=vs.map(v=>v.price).filter(x=>x!==null&&x!==undefined).map(Number);if(vp.length){const min=Math.min(...vp),max=Math.max(...vp);return min===max?`${min.toLocaleString('th-TH',{maximumFractionDigits:2})} บาท`:`เริ่มต้น ${min.toLocaleString('th-TH',{maximumFractionDigits:2})} บาท`}return p.price==null?'สอบถามราคา':Number(p.price).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท'}function renderProducts(){const q=search.value.trim().toLocaleLowerCase('th');let allowed=null;if(selected)allowed=new Set(descendants(selected));const rows=items.filter(p=>(!allowed||allowed.has(p.category_id))&&(!q||[p.name,p.short_description,p.description].join(' ').toLocaleLowerCase('th').includes(q)));count.textContent=`พบ ${rows.length.toLocaleString('th-TH')} รายการ`;grid.innerHTML=rows.length?rows.map(p=>{const pvs=variantsOf(p.id),vc=pvs.length,available=p.track_inventory?(vc?pvs.reduce((s,v)=>s+Math.max(0,Number(v.stock_qty||0)-Number(v.stock_reserved||0)),0):Math.max(0,Number(p.stock_qty||0)-Number(p.stock_reserved||0))):null;return `<a class="card" href="product-detail.html?id=${encodeURIComponent(p.id)}"><div class="cover">${p.cover_path?`<img src="${esc(img(p.cover_path))}" alt="${esc(p.name)}" loading="lazy">`:'<div class="empty-cover">ยังไม่มีรูป</div>'}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.short_description||'')}</div>${vc?`<div class="variant-count">มี ${vc.toLocaleString('th-TH')} ตัวเลือก</div>`:''}${p.track_inventory?`<div class="variant-count">${available>0?'พร้อมส่ง '+available.toLocaleString('th-TH')+' ชิ้น':'สินค้าหมด'}</div>`:''}<div class="price">${productPrice(p)}${p.price_note?` <small>${esc(p.price_note)}</small>`:''}</div></div></a>`}).join(''):'<div class="empty">ยังไม่มีสินค้าในหมวดนี้</div>'}async function load(){const [c,p,v]=await Promise.all([sb.from('product_categories').select('id,name,parent_id,sort_order').eq('is_active',true).order('sort_order').order('name'),sb.from('site_products').select('id,category_id,name,short_description,description,price,price_note,cover_path,track_inventory,stock_qty,stock_reserved,sort_order,created_at').eq('is_published',true).order('sort_order').order('created_at',{ascending:false}),sb.from('site_product_variants').select('id,product_id,name,price,stock_qty,stock_reserved,sort_order').eq('is_active',true).order('sort_order').order('created_at')]);if(c.error)throw c.error;if(p.error)throw p.error;if(v.error)throw v.error;cats=c.data||[];items=p.data||[];variants=v.data||[];renderTree();renderProducts()}search.addEventListener('input',renderProducts);document.querySelector('.cat[data-id=""]').onclick=()=>{selected='';document.querySelectorAll('[data-id]').forEach(x=>x.classList.remove('active'));document.querySelector('.cat[data-id=""]').classList.add('active');renderProducts()};load().catch(e=>{console.error(e);count.textContent='โหลดสินค้าไม่สำเร็จ';grid.innerHTML='<div class="empty">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>'})})();</script></body></html>
