<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายการสินค้า · AP CNC DIY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
:root{--bg:#081018;--panel:#0f1b25;--panel2:#13222e;--line:#233747;--line2:#365066;--ink:#f5f7fa;--muted:#9eacba;--amber:#f6a623;--cyan:#25c8d5;--green:#31d07c;--danger:#ef6b6b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.shell{width:min(1240px,calc(100% - 28px));margin:auto}.topbar{position:sticky;top:0;z-index:20;background:#071018f2;border-bottom:1px solid #162735}.topin{min-height:68px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:9px;background:#fff;object-fit:contain}.spacer{flex:1}.btn{min-height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:#0e1923;color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1206}.btn.cyan{border-color:var(--cyan);color:var(--cyan)}.btn.green{border-color:var(--green);color:var(--green)}.btn.danger{border-color:#77434a;color:#ff9ca6}.btn:disabled{opacity:.45;cursor:not-allowed}.hero{padding:34px 0 20px}.hero-row{display:flex;gap:18px;align-items:flex-end;justify-content:space-between}.hero h1{margin:0 0 6px;font-size:32px}.muted{color:var(--muted)}.owner-tools{display:none;gap:8px;flex-wrap:wrap}.owner .owner-tools{display:flex}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;margin:18px 0}.control{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);padding:0 13px;outline:none}.control:focus{border-color:var(--cyan)}.summary{font-size:13px;color:var(--muted);margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding-bottom:42px}.card{background:linear-gradient(180deg,var(--panel),#0c1821);border:1px solid var(--line);border-radius:14px;overflow:hidden}.product{display:flex;flex-direction:column;min-height:100%;cursor:pointer;transition:border-color .15s,transform .15s}.product:hover{border-color:var(--cyan);transform:translateY(-1px)}.cover{aspect-ratio:4/3;background:#0a1219;overflow:hidden;display:grid;place-items:center;border-bottom:1px solid var(--line);padding:8px}.cover img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{color:#718394;font-size:13px}.body{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}.title-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.title{font-size:19px;font-weight:700;line-height:1.35}.badge{font-size:10px;color:var(--cyan);border:1px solid #315264;background:#10232d;border-radius:999px;padding:4px 8px;white-space:nowrap}.badge.draft{color:#ffd582;border-color:#6b5323}.badge.unlisted{color:#ff9ca6;border-color:#77434a}.desc{font-size:13px;line-height:1.65;color:#c3cdd6}.meta{font-size:12px;color:var(--muted)}.price{margin-top:auto;font-size:15px;font-weight:700;color:var(--amber)}.product-actions{display:none;gap:7px;margin-top:5px;flex-wrap:wrap}.owner .product-actions{display:flex}.empty{grid-column:1/-1;padding:48px 20px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0f1b25;border:1px solid var(--line2);border-radius:15px;padding:20px;box-shadow:0 20px 60px #0009}.dialog h2{margin:0 0 16px}.form{display:grid;gap:12px}.form label{font-size:12px;color:var(--muted)}.form input,.form textarea,.form select{width:100%;margin-top:5px;border:1px solid var(--line2);background:#0a151e;color:var(--ink);border-radius:8px;padding:10px 11px;outline:0}.form textarea{min-height:110px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.image-editor{border:1px solid var(--line);border-radius:10px;background:#0a151e;padding:12px}.image-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.image-head strong{font-size:13px}.image-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.image-empty{grid-column:1/-1;padding:20px;border:1px dashed var(--line2);border-radius:8px;text-align:center;color:var(--muted);font-size:12px}.image-tile{position:relative;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#081119}.image-tile.cover-choice{border-color:var(--amber);box-shadow:0 0 0 1px #f6a62355}.image-thumb{aspect-ratio:4/3;background:#071019;display:grid;place-items:center}.image-thumb img{width:100%;height:100%;object-fit:contain;display:block}.image-cover-badge{position:absolute;left:6px;top:6px;padding:3px 7px;border-radius:999px;background:#f6a623;color:#1a1206;font-size:9px;font-weight:700}.image-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px}.image-actions button{min-height:30px;padding:0 6px;border:1px solid var(--line2);border-radius:6px;background:#101d27;color:var(--ink);font-size:10px;cursor:pointer}.image-actions .set-cover{grid-column:1/-1;color:var(--amber);border-color:#6a5428}.image-actions .remove{color:#ff9ca6;border-color:#77434a}.image-note{margin-top:9px;color:var(--muted);font-size:10px;line-height:1.55}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:none;padding:10px 14px;border:1px solid var(--line2);border-radius:9px;background:#0f1b25;color:#dce8ef;box-shadow:0 10px 30px #0008}.status.show{display:block}.status.err{border-color:#75434a;color:#ffb4ba}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.image-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.shell{width:min(100% - 20px,1240px)}.topin{min-height:62px}.brand strong{display:none}.btn{min-height:36px;padding:0 10px;font-size:11px}.hero{padding-top:24px}.hero-row{align-items:flex-start;flex-direction:column}.hero h1{font-size:27px}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topin"><a class="brand" href="index.html"><img src="assets/ap-cnc-diy-logo.jpg" alt="AP CNC DIY"><strong>AP CNC DIY</strong></a><div class="spacer"></div><a id="profileBack" class="btn" href="public-profile.html">กลับโปรไฟล์</a><a class="btn cyan" href="marketplace.html">Marketplace</a></div></header>
<main class="shell">
<section class="hero"><div class="hero-row"><div><h1>รายการสินค้า</h1><div id="profileName" class="muted">กำลังโหลดข้อมูล...</div></div><div class="owner-tools"><a class="btn primary" href="ap-cabinet-pro.html">+ เพิ่มจาก AP Cabinet Pro</a></div></div>
<div class="toolbar"><input id="searchInput" class="control" type="search" placeholder="ค้นหาสินค้า..."><select id="categorySelect" class="control"><option value="">ทุกหมวดหมู่</option></select></div><div id="summary" class="summary"></div></section>
<section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal"><div class="dialog"><h2>แก้ไขสินค้า</h2><form id="form" class="form"><input id="editId" type="hidden"><label>ชื่อสินค้า<input id="titleInput" required maxlength="120"></label><div class="two"><label>หมวดหมู่<input id="categoryInput" maxlength="80"></label><label>สถานะ<select id="statusInput"><option value="published">เผยแพร่</option><option value="draft">แบบร่าง</option><option value="unlisted">ถอนจาก Marketplace</option></select></label></div><div class="two"><label>ราคาเริ่มต้น (บาท)<input id="priceMinInput" type="number" min="0" step="1"></label><label>ราคาสูงสุด (บาท)<input id="priceMaxInput" type="number" min="0" step="1"></label></div><label>หมายเหตุราคา<input id="priceNoteInput" maxlength="160"></label><label>ราคาโมเดล (เครดิต)<input id="modelPriceCreditsInput" type="number" min="0" step="1" value="0"><small style="display:block;margin-top:5px;color:var(--muted)">0 = ฟรี · การเปลี่ยนราคาไม่มีผลย้อนหลังกับผู้ที่ซื้อไปแล้ว</small></label><label>รายละเอียด<textarea id="descriptionInput" maxlength="2000"></textarea></label><section class="image-editor"><div class="image-head"><strong>รูปภาพสินค้า</strong><button type="button" id="addImagesButton" class="btn cyan">+ เพิ่มรูป</button><input id="imageInput" type="file" accept="image/*" multiple hidden></div><div id="imageGrid" class="image-grid"></div><div class="image-note">สูงสุด 4 รูป · กด “เปลี่ยน” เพื่อแทนรูปเดิม · “ลบ” เพื่อนำรูปออก · เลือก “ตั้งเป็นรูปปก” ได้ 1 รูป</div></section><div class="dialog-actions"><button type="button" id="cancelButton" class="btn">ยกเลิก</button><button id="saveButton" type="submit" class="btn primary">บันทึก</button></div></form></div></div>
<div id="status" class="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><script src="auth-client.js"></script><script src="site-header.js"></script><script src="marketplace-storage.js"></script>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search),requestedId=params.get('id')||'';
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const grid=document.getElementById('grid'),searchInput=document.getElementById('searchInput'),categorySelect=document.getElementById('categorySelect'),summary=document.getElementById('summary'),profileName=document.getElementById('profileName'),profileBack=document.getElementById('profileBack'),modal=document.getElementById('modal'),form=document.getElementById('form'),imageGrid=document.getElementById('imageGrid'),imageInput=document.getElementById('imageInput'),addImagesButton=document.getElementById('addImagesButton'),saveButton=document.getElementById('saveButton');
let profileId=requestedId,owner=false,products=[],editImages=[],editCoverKey=null,editOriginalPaths=[],imagePickMode='add',replaceTargetKey=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt',"'":'&#39;','"':'&quot;'}[c]));
const publicFile=path=>window.MarketplaceStorage.url(path);
const fmt=n=>Number(n||0).toLocaleString('th-TH');
function toast(message,err=false){const el=document.getElementById('status');el.textContent=message;el.className='status show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='status',2800)}
function priceText(p){const a=Number(p.price_min_thb||0),b=Number(p.price_max_thb||0);if(a&&b)return`${fmt(a)}–${fmt(b)} บาท`;if(a)return`เริ่มต้น ${fmt(a)} บาท`;if(b)return`ไม่เกิน ${fmt(b)} บาท`;return p.price_note||'สอบถามราคา'}
function rebuildCategories(){const current=categorySelect.value;const cats=[...new Set(products.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));categorySelect.innerHTML='<option value="">ทุกหมวดหมู่</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(cats.includes(current))categorySelect.value=current}
function render(){const q=searchInput.value.trim().toLocaleLowerCase('th'),cat=categorySelect.value;const rows=products.filter(p=>(!cat||p.category===cat)&&(!q||[p.title,p.category,p.description,p.status].join(' ').toLocaleLowerCase('th').includes(q)));summary.textContent=`ทั้งหมด ${products.length.toLocaleString('th-TH')} รายการ · แสดง ${rows.length.toLocaleString('th-TH')} รายการ`;if(!rows.length){grid.innerHTML=`<div class="card empty">${owner&&products.length===0?'ยังไม่มีผลงานจาก Marketplace — ให้เผยแพร่จาก AP Cabinet Pro ก่อน':'ไม่พบสินค้าที่ตรงกับการค้นหา'}</div>`;return}grid.innerHTML=rows.map(p=>{const cover=publicFile(p.cover_path),badgeClass=p.status==='draft'?'draft':p.status==='unlisted'?'unlisted':'';return`<article class="card product" data-detail="${p.id}" tabindex="0" role="link"><div class="cover">${cover?`<img src="${esc(cover)}" alt="${esc(p.title)}" loading="lazy">`:'<div class="placeholder">ยังไม่มีภาพปก</div>'}</div><div class="body"><div class="title-row"><div class="title">${esc(p.title)}</div><span class="badge ${badgeClass}">${esc(p.status)}</span></div>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="meta">${esc(p.category||'ทั่วไป')} · ${p.preview_path?'มี 3D Preview':'ไม่มี 3D Preview'}</div><div class="price">${esc(priceText(p))}</div><div class="product-actions"><a class="btn cyan" href="marketplace-item.html?id=${encodeURIComponent(p.id)}">ดู</a><button class="btn" data-edit="${p.id}">แก้ไข</button>${p.status==='published'?`<button class="btn danger" data-unlist="${p.id}">ถอนเผยแพร่</button>`:''}<button class="btn danger" data-delete="${p.id}">ลบ</button></div></div></article>`}).join('')}
function revokeLocalImages(){for(const item of editImages)if(item.localUrl)URL.revokeObjectURL(item.localUrl)}
function imageKey(){return'new-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function renderImageEditor(){if(!editImages.length){imageGrid.innerHTML='<div class="image-empty">ยังไม่มีรูปสินค้า กด “+ เพิ่มรูป” เพื่ออัปโหลด</div>'}else{imageGrid.innerHTML=editImages.map(item=>{const src=item.file?item.localUrl:publicFile(item.path);const isCover=item.key===editCoverKey;return`<div class="image-tile ${isCover?'cover-choice':''}" data-key="${esc(item.key)}"><div class="image-thumb"><img src="${esc(src)}" alt="รูปสินค้า">${isCover?'<span class="image-cover-badge">รูปปก</span>':''}</div><div class="image-actions"><button type="button" data-replace="${esc(item.key)}">เปลี่ยน</button><button type="button" class="remove" data-remove="${esc(item.key)}">ลบ</button>${isCover?'':`<button type="button" class="set-cover" data-cover="${esc(item.key)}">ตั้งเป็นรูปปก</button>`}</div></div>`}).join('')}addImagesButton.disabled=editImages.length>=4}
function openEditor(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById('editId').value=p.id;document.getElementById('titleInput').value=p.title||'';document.getElementById('categoryInput').value=p.category||'';document.getElementById('statusInput').value=p.status||'draft';document.getElementById('priceMinInput').value=p.price_min_thb??'';document.getElementById('priceMaxInput').value=p.price_max_thb??'';document.getElementById('priceNoteInput').value=p.price_note||'';document.getElementById('modelPriceCreditsInput').value=Number(p.price_credits||0);document.getElementById('descriptionInput').value=p.description||'';revokeLocalImages();const paths=[p.cover_path,...(Array.isArray(p.gallery_paths)?p.gallery_paths:[])].filter(Boolean);const unique=[...new Set(paths)].slice(0,4);editImages=unique.map((path,i)=>({key:'existing-'+i+'-'+path,type:'existing',path}));editOriginalPaths=[...unique];editCoverKey=p.cover_path?editImages.find(x=>x.path===p.cover_path)?.key||editImages[0]?.key:null;if(!editCoverKey&&editImages.length)editCoverKey=editImages[0].key;renderImageEditor();modal.classList.add('show')}
function closeEditor(){modal.classList.remove('show');form.reset();revokeLocalImages();editImages=[];editCoverKey=null;editOriginalPaths=[];imageInput.value='';saveButton.disabled=false;saveButton.textContent='บันทึก'}
function validImageFile(file){return file&&/^image\//i.test(file.type)&&file.size<=12*1024*1024}
function extensionFor(file){const name=(file.name||'').split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'');if(name&&name.length<=5)return name;const map={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/heic':'heic','image/heif':'heif'};return map[file.type]||'jpg'}
async function uploadNewImages(id){const newlyUploaded=[];const resolved=[];try{for(let i=0;i<editImages.length;i++){const item=editImages[i];if(!item.file){resolved.push({key:item.key,path:item.path});continue}const path=await window.MarketplaceStorage.uploadImage(item.file,id,item.key===editCoverKey?'cover':'gallery',sb);newlyUploaded.push(path);resolved.push({key:item.key,path})}return{resolved,newlyUploaded}}catch(err){for(const path of newlyUploaded){try{await window.MarketplaceStorage.remove(path,sb)}catch(_){}}throw err}}
async function loadProducts(){let query=sb.from('market_models').select('id,seller_id,title,description,status,category,price_min_thb,price_max_thb,price_note,price_credits,cover_path,preview_path,gallery_paths,created_at,updated_at').eq('seller_id',profileId).order('created_at',{ascending:false});if(!owner)query=query.eq('status','published');const {data,error}=await query;if(error)throw error;products=data||[];rebuildCategories();render()}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!profileId&&user)profileId=user.id;if(!profileId){profileName.textContent='ไม่พบโปรไฟล์';return}profileBack.href='public-profile.html?id='+encodeURIComponent(profileId);const {data,error}=await sb.from('public_profiles').select('user_id,display_name,is_public').eq('user_id',profileId).maybeSingle();if(error||!data){profileName.textContent='ไม่พบโปรไฟล์';return}owner=!!user&&user.id===profileId;if(!data.is_public&&!owner){profileName.textContent='โปรไฟล์นี้ไม่ได้เปิดเป็นสาธารณะ';grid.innerHTML='<div class="card empty">ไม่สามารถดูรายการสินค้าได้</div>';return}if(owner)document.body.classList.add('owner');profileName.textContent=`สินค้าและผลงานของ ${data.display_name||'ผู้ใช้งาน AP Cabinet Pro'}`;await loadProducts()}
searchInput.addEventListener('input',render);categorySelect.addEventListener('change',render);document.getElementById('cancelButton').addEventListener('click',closeEditor);modal.addEventListener('click',e=>{if(e.target===modal)closeEditor()});
addImagesButton.addEventListener('click',()=>{imagePickMode='add';replaceTargetKey=null;imageInput.multiple=true;imageInput.value='';imageInput.click()});
imageGrid.addEventListener('click',e=>{const cover=e.target.closest('[data-cover]'),remove=e.target.closest('[data-remove]'),replace=e.target.closest('[data-replace]');if(cover){editCoverKey=cover.dataset.cover;renderImageEditor();return}if(remove){const key=remove.dataset.remove,item=editImages.find(x=>x.key===key);if(item?.localUrl)URL.revokeObjectURL(item.localUrl);editImages=editImages.filter(x=>x.key!==key);if(editCoverKey===key)editCoverKey=editImages[0]?.key||null;renderImageEditor();return}if(replace){imagePickMode='replace';replaceTargetKey=replace.dataset.replace;imageInput.multiple=false;imageInput.value='';imageInput.click()}});
imageInput.addEventListener('change',()=>{const files=[...imageInput.files];if(!files.length)return;if(imagePickMode==='replace'){const file=files[0];if(!validImageFile(file))return toast('รองรับเฉพาะไฟล์รูปภาพขนาดไม่เกิน 12 MB',true);const item=editImages.find(x=>x.key===replaceTargetKey);if(!item)return;if(item.localUrl)URL.revokeObjectURL(item.localUrl);item.file=file;item.localUrl=URL.createObjectURL(file);item.originPath=item.path||item.originPath||null;delete item.path;item.type='new';renderImageEditor();return}const capacity=4-editImages.length;if(capacity<=0)return toast('เพิ่มรูปได้สูงสุด 4 รูป',true);let added=0;for(const file of files.slice(0,capacity)){if(!validImageFile(file)){toast('ข้ามไฟล์ที่ไม่ใช่รูปหรือมีขนาดเกิน 12 MB',true);continue}editImages.push({key:imageKey(),type:'new',file,localUrl:URL.createObjectURL(file)});added++}if(!editCoverKey&&editImages.length)editCoverKey=editImages[0].key;if(files.length>capacity)toast('เพิ่มได้สูงสุด 4 รูป');if(added)renderImageEditor()});
grid.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),unlist=e.target.closest('[data-unlist]'),del=e.target.closest('[data-delete]');if(edit&&owner){e.stopPropagation();return openEditor(edit.dataset.edit)}if(unlist&&owner){e.stopPropagation();if(!confirm('ถอนรายการนี้ออกจาก Marketplace?'))return;const {error}=await sb.from('market_models').update({status:'unlisted',delisted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',unlist.dataset.unlist).eq('seller_id',profileId);if(error)return toast(error.message,true);toast('ถอนเผยแพร่แล้ว');return loadProducts()}if(del&&owner){e.stopPropagation();if(!confirm('ลบสินค้านี้ออกจาก Marketplace และเอาออกจาก Library ของผู้ขาย?\n\nผู้ซื้อที่ยังเก็บสิทธิ์อยู่จะยังใช้งานโมเดลได้ตามเดิม\n\nเมื่อไม่มีผู้ใช้คนใดเก็บโมเดลไว้ใน Library แล้ว ไฟล์ต้นฉบับจะถูกลบและอาจกู้คืนไม่ได้'))return;const {data,error}=await sb.rpc('retire_market_model',{p_model_id:del.dataset.delete});if(error)return toast('ลบไม่ได้: '+error.message,true);if(data?.purge_eligible){try{const sr=await sb.auth.getSession();const token=sr.data?.session?.access_token;if(token){const response=await fetch('/api/marketplace-public/purge?model_id='+encodeURIComponent(del.dataset.delete),{method:'POST',headers:{Authorization:'Bearer '+token}});if(!response.ok)console.warn('Marketplace purge deferred',await response.text())}}catch(purgeError){console.warn('Marketplace purge deferred',purgeError)}}toast(data?.purge_eligible?'ลบออกจากรายการและล้างไฟล์ที่ไม่มีผู้ใช้งานแล้ว':'ลบออกจากรายการแล้ว · สิทธิ์ของผู้ซื้อเดิมยังคงอยู่');return loadProducts()}const detail=e.target.closest('[data-detail]');if(detail&&!e.target.closest('button,a'))location.href='marketplace-item.html?id='+encodeURIComponent(detail.dataset.detail)});
grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button,a')){const detail=e.target.closest('[data-detail]');if(detail){e.preventDefault();location.href='marketplace-item.html?id='+encodeURIComponent(detail.dataset.detail)}}});
form.addEventListener('submit',async e=>{e.preventDefault();if(!owner)return;const id=document.getElementById('editId').value,min=document.getElementById('priceMinInput').value,max=document.getElementById('priceMaxInput').value,title=document.getElementById('titleInput').value.trim(),modelPrice=Number(document.getElementById('modelPriceCreditsInput').value||0);if(!title)return toast('กรุณาใส่ชื่อสินค้า',true);if(!Number.isInteger(modelPrice)||modelPrice<0)return toast('ราคาโมเดลต้องเป็นจำนวนเครดิตตั้งแต่ 0 ขึ้นไป',true);if(editImages.length>4)return toast('รูปภาพต้องไม่เกิน 4 รูป',true);saveButton.disabled=true;saveButton.textContent='กำลังบันทึก...';let uploaded=[];try{const uploadResult=await uploadNewImages(id);uploaded=uploadResult.newlyUploaded;const resolved=uploadResult.resolved;const coverPath=resolved.find(x=>x.key===editCoverKey)?.path||resolved[0]?.path||null;const galleryPaths=resolved.map(x=>x.path).filter(path=>path&&path!==coverPath);const payload={title,category:document.getElementById('categoryInput').value.trim()||'อื่น ๆ',description:document.getElementById('descriptionInput').value.trim(),status:document.getElementById('statusInput').value,price_min_thb:min===''?null:Number(min),price_max_thb:max===''?null:Number(max),price_note:document.getElementById('priceNoteInput').value.trim()||null,price_credits:modelPrice,cover_path:coverPath,gallery_paths:galleryPaths,updated_at:new Date().toISOString()};const {error}=await sb.from('market_models').update(payload).eq('id',id).eq('seller_id',profileId);if(error){for(const path of uploaded){try{await window.MarketplaceStorage.remove(path,sb)}catch(_){}}throw error}const retained=new Set(resolved.map(x=>x.path));const stale=editOriginalPaths.filter(path=>path&&!retained.has(path));if(stale.length){for(const path of stale){try{await window.MarketplaceStorage.remove(path,sb)}catch(cleanupError){console.warn('image cleanup failed',cleanupError)}}}closeEditor();toast('บันทึกสินค้าและรูปภาพแล้ว');await loadProducts()}catch(err){console.error(err);toast('บันทึกไม่สำเร็จ: '+(err?.message||err),true);saveButton.disabled=false;saveButton.textContent='บันทึก'}});
boot().catch(err=>{console.error(err);profileName.textContent='โหลดข้อมูลไม่สำเร็จ';grid.innerHTML=`<div class="card empty">${esc(err?.message||'เกิดข้อผิดพลาด')}</div>`})})();
</script>
</body></html>
