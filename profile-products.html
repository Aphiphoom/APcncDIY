<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายการสินค้า · AP CNC DIY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
:root{--bg:#081018;--panel:#0f1b25;--panel2:#13222e;--line:#233747;--line2:#365066;--ink:#f5f7fa;--muted:#9eacba;--amber:#f6a623;--cyan:#25c8d5;--green:#31d07c;--danger:#ef6b6b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.shell{width:min(1240px,calc(100% - 28px));margin:auto}.topbar{position:sticky;top:0;z-index:20;background:#071018f2;border-bottom:1px solid #162735}.topin{min-height:68px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:9px;background:#fff}.spacer{flex:1}.btn{min-height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:#0e1923;color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1206}.btn.cyan{border-color:var(--cyan);color:var(--cyan)}.btn.danger{border-color:#77434a;color:#ff9ca6}.hero{padding:34px 0 20px}.hero-row{display:flex;gap:18px;align-items:flex-end;justify-content:space-between}.hero h1{margin:0 0 6px;font-size:32px}.muted{color:var(--muted)}.owner-tools{display:none;gap:8px;flex-wrap:wrap}.owner .owner-tools{display:flex}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;margin:18px 0}.control{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);padding:0 13px;outline:none}.control:focus{border-color:var(--cyan)}.summary{font-size:13px;color:var(--muted);margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding-bottom:42px}.card{background:linear-gradient(180deg,var(--panel),#0c1821);border:1px solid var(--line);border-radius:14px;overflow:hidden}.product{display:flex;flex-direction:column;min-height:100%}.cover{aspect-ratio:4/3;background:#111c25;overflow:hidden;display:grid;place-items:center;border-bottom:1px solid var(--line)}.cover img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{color:#718394;font-size:13px}.body{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}.title-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.title{font-size:19px;font-weight:700;line-height:1.35}.badge{font-size:10px;color:var(--cyan);border:1px solid #315264;background:#10232d;border-radius:999px;padding:4px 8px;white-space:nowrap}.desc{font-size:13px;line-height:1.65;color:#c3cdd6}.price{margin-top:auto;font-size:15px;font-weight:700;color:var(--amber)}.product-actions{display:none;gap:7px;margin-top:5px}.owner .product-actions{display:flex}.empty{grid-column:1/-1;padding:48px 20px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{width:min(620px,100%);max-height:92vh;overflow:auto;background:#0f1b25;border:1px solid var(--line2);border-radius:15px;padding:20px;box-shadow:0 20px 60px #0009}.dialog h2{margin:0 0 16px}.form{display:grid;gap:12px}.form label{font-size:12px;color:var(--muted)}.form input,.form textarea,.form select{width:100%;margin-top:5px;border:1px solid var(--line2);background:#0a151e;color:var(--ink);border-radius:8px;padding:10px 11px;outline:none}.form textarea{min-height:110px;resize:vertical}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--cyan)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:none;padding:10px 14px;border:1px solid var(--line2);border-radius:9px;background:#0f1b25;color:#dce8ef;box-shadow:0 10px 30px #0008}.status.show{display:block}.status.err{border-color:#75434a;color:#ffb4ba}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.shell{width:min(100% - 20px,1240px)}.topin{min-height:62px}.brand strong{display:none}.btn{min-height:36px;padding:0 10px;font-size:11px}.hero{padding-top:24px}.hero-row{align-items:flex-start;flex-direction:column}.hero h1{font-size:27px}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topin"><a class="brand" href="index.html"><img src="assets/ap-cnc-diy-logo.jpg" alt="AP CNC DIY"><strong>AP CNC DIY</strong></a><div class="spacer"></div><a id="profileBack" class="btn" href="public-profile.html">กลับโปรไฟล์</a><a class="btn cyan" href="marketplace.html">Marketplace</a></div></header>
<main class="shell">
<section class="hero"><div class="hero-row"><div><h1>รายการสินค้า</h1><div id="profileName" class="muted">กำลังโหลดข้อมูล...</div></div><div class="owner-tools"><button id="addButton" class="btn primary">+ เพิ่มสินค้า</button></div></div>
<div class="toolbar"><input id="searchInput" class="control" type="search" placeholder="ค้นหาสินค้า..."><select id="categorySelect" class="control"><option value="">ทุกหมวดหมู่</option></select></div><div id="summary" class="summary"></div></section>
<section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal"><div class="dialog"><h2 id="dialogTitle">เพิ่มสินค้า</h2><form id="form" class="form"><input id="editIndex" type="hidden" value="-1"><label>ชื่อสินค้า<input id="titleInput" required maxlength="120" placeholder="เช่น ชุดครัวโมเดิร์น"></label><div class="two"><label>หมวดหมู่<input id="categoryInput" maxlength="80" placeholder="เช่น ชุดครัว"></label><label>ราคาอ้างอิง<input id="priceInput" maxlength="80" placeholder="เช่น เริ่มต้น 65,000 บาท"></label></div><label>URL รูปภาพ<input id="imageInput" type="url" placeholder="https://..."></label><label>รายละเอียด<textarea id="descriptionInput" maxlength="1200" placeholder="วัสดุ รูปแบบงาน ขอบเขตบริการ หรือรายละเอียดที่ลูกค้าควรรู้"></textarea></label><div class="dialog-actions"><button type="button" id="cancelButton" class="btn">ยกเลิก</button><button type="submit" class="btn primary">บันทึกสินค้า</button></div></form></div></div>
<div id="status" class="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search);const requestedId=params.get('id')||'';const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const grid=document.getElementById('grid'),searchInput=document.getElementById('searchInput'),categorySelect=document.getElementById('categorySelect'),summary=document.getElementById('summary'),profileName=document.getElementById('profileName'),profileBack=document.getElementById('profileBack'),modal=document.getElementById('modal'),form=document.getElementById('form');let profile=null,profileId=requestedId,owner=false,products=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(message,err=false){const el=document.getElementById('status');el.textContent=message;el.className='status show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='status',2600)}
function normalize(p,i){return{id:p?.id||`product-${i}-${Date.now()}`,title:String(p?.title||p?.name||'สินค้า'),category:String(p?.category||'ทั่วไป'),description:String(p?.description||p?.detail||''),image_url:String(p?.image_url||p?.image||''),price:String(p?.price||p?.price_text||'สอบถามราคา')}}
function rebuildCategories(){const current=categorySelect.value;const cats=[...new Set(products.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));categorySelect.innerHTML='<option value="">ทุกหมวดหมู่</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(cats.includes(current))categorySelect.value=current}
function render(){const q=searchInput.value.trim().toLocaleLowerCase('th'),cat=categorySelect.value;const rows=products.map((p,i)=>({p,i})).filter(({p})=>(!cat||p.category===cat)&&(!q||[p.title,p.category,p.description,p.price].join(' ').toLocaleLowerCase('th').includes(q)));summary.textContent=`ทั้งหมด ${products.length.toLocaleString('th-TH')} รายการ · แสดง ${rows.length.toLocaleString('th-TH')} รายการ`;if(!rows.length){grid.innerHTML=`<div class="card empty">${owner&&products.length===0?'ยังไม่มีสินค้า กด “เพิ่มสินค้า” เพื่อเริ่มสร้างรายการ':'ไม่พบสินค้าที่ตรงกับการค้นหา'}</div>`;return}grid.innerHTML=rows.map(({p,i})=>`<article class="card product"><div class="cover">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy" onerror="this.remove();this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>ไม่สามารถโหลดรูปภาพได้</div>'">`:'<div class="placeholder">ยังไม่มีรูปภาพ</div>'}</div><div class="body"><div class="title-row"><div class="title">${esc(p.title)}</div><span class="badge">${esc(p.category||'ทั่วไป')}</span></div>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="price">${esc(p.price||'สอบถามราคา')}</div><div class="product-actions"><button class="btn" data-edit="${i}">แก้ไข</button><button class="btn danger" data-delete="${i}">ลบ</button></div></div></article>`).join('')}
function openEditor(index=-1){const p=index>=0?products[index]:null;document.getElementById('dialogTitle').textContent=p?'แก้ไขสินค้า':'เพิ่มสินค้า';document.getElementById('editIndex').value=String(index);document.getElementById('titleInput').value=p?.title||'';document.getElementById('categoryInput').value=p?.category||'';document.getElementById('priceInput').value=p?.price||'';document.getElementById('imageInput').value=p?.image_url||'';document.getElementById('descriptionInput').value=p?.description||'';modal.classList.add('show');setTimeout(()=>document.getElementById('titleInput').focus(),30)}function closeEditor(){modal.classList.remove('show');form.reset();document.getElementById('editIndex').value='-1'}
async function persist(next){const {error}=await sb.from('public_profiles').update({products:next,updated_at:new Date().toISOString()}).eq('user_id',profileId);if(error)throw error;products=next.map(normalize);rebuildCategories();render()}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!profileId&&user)profileId=user.id;if(!profileId){profileName.textContent='ไม่พบโปรไฟล์';grid.innerHTML='<div class="card empty">ไม่พบรหัสโปรไฟล์</div>';return}profileBack.href='public-profile.html?id='+encodeURIComponent(profileId);const {data,error}=await sb.from('public_profiles').select('user_id,display_name,products,is_public').eq('user_id',profileId).maybeSingle();if(error||!data){profileName.textContent='ไม่พบโปรไฟล์';grid.innerHTML='<div class="card empty">ไม่พบข้อมูลโปรไฟล์นี้</div>';return}profile=data;owner=!!user&&user.id===profileId;if(!profile.is_public&&!owner){profileName.textContent='โปรไฟล์นี้ไม่ได้เปิดเป็นสาธารณะ';grid.innerHTML='<div class="card empty">ไม่สามารถดูรายการสินค้าได้</div>';return}if(owner)document.body.classList.add('owner');profileName.textContent=`สินค้าและผลงานของ ${profile.display_name||'ผู้ใช้งาน AP Cabinet Pro'}`;products=(Array.isArray(profile.products)?profile.products:[]).map(normalize);rebuildCategories();render()}
searchInput.addEventListener('input',render);categorySelect.addEventListener('change',render);document.getElementById('addButton').addEventListener('click',()=>openEditor(-1));document.getElementById('cancelButton').addEventListener('click',closeEditor);modal.addEventListener('click',e=>{if(e.target===modal)closeEditor()});grid.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit&&owner){openEditor(Number(edit.dataset.edit));return}if(del&&owner){const i=Number(del.dataset.delete);if(!Number.isInteger(i)||!products[i])return;if(!confirm(`ลบ “${products[i].title}” ออกจากรายการสินค้า?`))return;try{await persist(products.filter((_,x)=>x!==i));toast('ลบสินค้าแล้ว')}catch(err){toast(err?.message||'ลบสินค้าไม่สำเร็จ',true)}}});form.addEventListener('submit',async e=>{e.preventDefault();if(!owner)return;const i=Number(document.getElementById('editIndex').value);const item={id:i>=0&&products[i]?.id?products[i].id:(crypto.randomUUID?crypto.randomUUID():`p-${Date.now()}`),title:document.getElementById('titleInput').value.trim(),category:document.getElementById('categoryInput').value.trim()||'ทั่วไป',price:document.getElementById('priceInput').value.trim()||'สอบถามราคา',image_url:document.getElementById('imageInput').value.trim(),description:document.getElementById('descriptionInput').value.trim()};if(!item.title)return;const next=products.map(p=>({...p}));if(i>=0)next[i]=item;else next.unshift(item);try{await persist(next);closeEditor();toast(i>=0?'แก้ไขสินค้าแล้ว':'เพิ่มสินค้าแล้ว')}catch(err){toast(err?.message||'บันทึกสินค้าไม่สำเร็จ',true)}});boot().catch(err=>{console.error(err);profileName.textContent='โหลดข้อมูลไม่สำเร็จ';grid.innerHTML='<div class="card empty">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>'})})();
</script>
</body></html>
