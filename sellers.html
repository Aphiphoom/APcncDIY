<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายชื่อผู้ขาย · AP CNC DIY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
:root{--bg:#0d1218;--panel:#161e27;--panel2:#202b37;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--cyan:#25c8d5;--amber:#f6a623}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 44px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0006}.hero{padding:24px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:32px;color:var(--cyan)}.hero p{margin:0;color:var(--muted);line-height:1.7}.toolbar{display:flex;gap:10px;margin-top:18px}.control{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);padding:0 13px;flex:1}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font-weight:700}.btn-cyan{border-color:var(--cyan);color:var(--cyan)}.summary{margin:14px 2px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.seller{padding:18px;display:flex;gap:14px;align-items:center;transition:.15s}.seller:hover{border-color:var(--cyan);transform:translateY(-2px)}.avatar{width:72px;height:72px;border-radius:50%;background:#0a1219;border:1px solid var(--line);object-fit:cover;flex:0 0 auto}.avatar-placeholder{display:grid;place-items:center;font-weight:700;color:var(--cyan);font-size:22px}.info{min-width:0;flex:1}.name{font-size:19px;font-weight:700;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tagline,.location{font-size:12px;color:var(--muted);line-height:1.5}.location{margin-top:5px}.view{margin-top:10px;color:var(--cyan);font-size:12px;font-weight:700}.empty,.error{grid-column:1/-1;padding:34px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{width:min(100% - 20px,1180px);padding-top:20px}.hero{padding:20px}.toolbar{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <section class="card hero">
    <h1>รายชื่อผู้ขาย</h1>
    <p>รายชื่อสมาชิก AP Cabinet Pro ที่เปิด Public Profile สำหรับติดต่อและดูผลงาน</p>
    <div class="toolbar"><input id="searchInput" class="control" type="search" placeholder="ค้นหาชื่อร้าน หรือพื้นที่..."><a class="btn btn-cyan" href="marketplace.html">กลับ Marketplace</a></div>
  </section>
  <div id="summary" class="summary">กำลังโหลดรายชื่อผู้ขาย...</div>
  <main id="sellerGrid" class="grid"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="auth-client.js"></script><script src="site-header.js"></script>
<script>
(()=>{
  const grid=document.getElementById('sellerGrid'),summary=document.getElementById('summary'),search=document.getElementById('searchInput');
  let rows=[];
  const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
  const publicFile=p=>p?`${window.SUPABASE_URL}/storage/v1/object/public/profile-public/${String(p).split('/').map(encodeURIComponent).join('/')}`:'';
  const initials=name=>(String(name||'AP').trim().slice(0,2)||'AP').toUpperCase();
  function avatarUrl(r){
    if(!r.avatar_path)return '';
    if(/^https?:\/\//i.test(r.avatar_path))return r.avatar_path;
    return publicFile(r.avatar_path);
  }
  function render(){
    const q=search.value.trim().toLocaleLowerCase('th');
    const data=rows.filter(r=>!q||[r.display_name,r.tagline,r.province,r.country].join(' ').toLocaleLowerCase('th').includes(q));
    summary.textContent=`พบ ${data.length.toLocaleString('th-TH')} ผู้ขาย`;
    if(!data.length){grid.innerHTML='<div class="card empty">ยังไม่พบผู้ขายที่ตรงกับการค้นหา</div>';return}
    grid.innerHTML=data.map(r=>{
      const avatar=avatarUrl(r),name=r.display_name||'สมาชิก AP Cabinet Pro';
      const location=[r.province,r.country].filter(Boolean).join(', ');
      return `<a class="card seller" href="public-profile.html?id=${encodeURIComponent(r.user_id)}">${avatar?`<img class="avatar" src="${esc(avatar)}" alt="${esc(name)}" loading="lazy">`:`<div class="avatar avatar-placeholder">${esc(initials(name))}</div>`}<div class="info"><div class="name">${esc(name)}</div><div class="tagline">${esc(r.tagline||'ผู้ใช้งาน AP Cabinet Pro')}</div>${location?`<div class="location">${esc(location)}</div>`:''}<div class="view">ดูโปรไฟล์ →</div></div></a>`;
    }).join('');
  }
  async function load(){
    const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
    let result=await sb.from('public_profiles').select('user_id,display_name,tagline,province,country,avatar_path,is_public').eq('is_public',true).order('display_name',{ascending:true});
    if(result.error){
      result=await sb.from('public_profiles').select('user_id,display_name,is_public').eq('is_public',true).order('display_name',{ascending:true});
    }
    if(result.error)throw result.error;
    rows=result.data||[];
    render();
  }
  search.addEventListener('input',render);
  load().catch(e=>{console.error(e);summary.textContent='โหลดรายชื่อผู้ขายไม่สำเร็จ';grid.innerHTML='<div class="card error">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>'});
})();
</script>
</body>
</html>
