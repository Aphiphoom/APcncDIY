<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ได้รับคำสั่งซื้อแล้ว · AP CNC DIY</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1218;--panel:#161e27;--line:#364454;--ink:#f4f7fb;--muted:#9eacba;--amber:#f6a623;--green:#45c98a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif}.shell{width:min(760px,calc(100% - 28px));margin:auto;padding:36px 0 56px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}.ok{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#123322;color:var(--green);font-size:30px;font-weight:800;margin-bottom:16px}h1{margin:0 0 8px;font-size:28px}.lead{color:var(--muted);line-height:1.7;margin:0 0 20px}.status{display:inline-flex;padding:7px 11px;border:1px solid #356348;border-radius:999px;background:#10271d;color:#a9e7c3;font-size:13px;font-weight:700;margin-bottom:18px}.box{background:#101923;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #293845}.row:last-child{border:0}.row span{color:var(--muted)}.row strong{text-align:right;overflow-wrap:anywhere;min-width:0}.note{margin-top:18px;padding:14px;border-left:3px solid var(--amber);background:#1a160e;color:#d9d0bf;border-radius:8px;line-height:1.65;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:#202b37;color:var(--ink);text-decoration:none;font-weight:700}.btn.primary{background:var(--amber);border-color:var(--amber);color:#171006}@media(max-width:620px){.actions{grid-template-columns:1fr}h1{font-size:24px}}</style></head>
<body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script><script src="config.js"></script><div class="shell"><section class="card"><div class="ok">✓</div><h1>ได้รับคำสั่งซื้อแล้ว</h1><p class="lead">ระบบได้รับคำสั่งซื้อและสลิปการโอนเงินของคุณแล้ว ขณะนี้กำลังรอแอดมินตรวจสอบการชำระเงิน</p><div class="status">รอตรวจสอบการชำระเงิน</div><div id="summary" class="box">กำลังโหลดข้อมูลคำสั่งซื้อ...</div><div class="note">หลังตรวจสอบการชำระเงินเรียบร้อย ทีมงานจะดำเนินการจัดเตรียมและจัดส่งสินค้าตามข้อมูลที่ระบุไว้</div><div class="actions"><a class="btn primary" href="products.html">กลับไปเลือกสินค้า</a><a class="btn" href="index.html">กลับหน้าหลัก</a></div></section></div>
<script>(()=>{const qs=new URLSearchParams(location.search),id=qs.get('id'),token=qs.get('token'),box=document.getElementById('summary'),fmt=v=>Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let local={};try{local=JSON.parse(localStorage.getItem('apcncdiy_last_order')||'{}')}catch(_){}function render(o){box.innerHTML='<div class="row"><span>เลขคำสั่งซื้อ</span><strong>'+esc(o.order_no||'-')+'</strong></div><div class="row"><span>ยอดชำระ</span><strong>'+fmt(o.total)+'</strong></div>'}if(local.order_id===id)render(local);if(!id||!token){if(local.order_id!==id)box.textContent='ไม่พบข้อมูลคำสั่งซื้อ';return}const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);sb.rpc('get_guest_shop_order',{p_order_id:id,p_token:token}).then(({data,error})=>{if(error||!data){if(local.order_id!==id)box.textContent='ไม่สามารถโหลดรายละเอียดคำสั่งซื้อได้';return}render(data)}).catch(()=>{if(local.order_id!==id)box.textContent='ไม่สามารถโหลดรายละเอียดคำสั่งซื้อได้'})})();</script></body></html>
