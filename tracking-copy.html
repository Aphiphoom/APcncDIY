<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คัดลอกเลขพัสดุ · AP CNC DIY</title><style>body{margin:0;background:#0d1218;color:#f4f7fb;font-family:system-ui,sans-serif}.card{max-width:530px;margin:9vh auto;padding:28px;background:#161e27;border:1px solid #364454;border-radius:16px}h1{font-size:23px}.number{padding:16px;background:#0c151e;border:1px solid #364454;border-radius:9px;font-size:22px;font-weight:700;overflow-wrap:anywhere;user-select:all}button,a{display:block;box-sizing:border-box;width:100%;border-radius:9px;padding:13px;text-align:center;margin-top:13px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}button{border:0;background:#f6a623;color:#181109}a{border:1px solid #364454;color:white}p{color:#a9b7c4}#message{min-height:26px;color:#45c98a}@media(max-width:580px){.card{margin:20px 12px;padding:20px}}</style></head><body><main class="card"><h1>คัดลอกเลขพัสดุ</h1><p>แตะปุ่มด้านล่างเพื่อคัดลอกหมายเลข Tracking</p><div class="number" id="number">—</div><button id="copy" type="button" disabled>คัดลอกเลขพัสดุ</button><p id="message" role="status"></p><a id="track" style="display:none" target="_blank" rel="noopener noreferrer">ตรวจสอบสถานะพัสดุ ↗</a></main><script>(()=>{const q=new URLSearchParams(location.search),number=(q.get('tracking')||'').trim().toUpperCase(),carrier=(q.get('carrier')||'').trim();if(!/^[A-Z0-9-]{5,50}$/.test(number)){document.getElementById('message').textContent='เลขพัสดุไม่ถูกต้อง';return}document.getElementById('number').textContent=number;const btn=document.getElementById('copy');btn.disabled=false;btn.onclick=async()=>{try{await navigator.clipboard.writeText(number);document.getElementById('message').textContent='คัดลอกเรียบร้อยแล้ว'}catch{document.getElementById('message').textContent='กดค้างที่เลขพัสดุด้านบนแล้วเลือกคัดลอก'}};const url=/flash/i.test(carrier)?'https://www.flashexpress.co.th/fle/tracking?se='+encodeURIComponent(number):/kex|kerry/i.test(carrier)?'https://th.kex-express.com/th/track-parcel':null;if(url){const a=document.getElementById('track');a.href=url;a.style.display='block'}})()</script></body></html>
